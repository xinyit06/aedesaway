a-soft)!important;color:var(--aa-text)!important}\r\nnav a[aria-current],.tabs button[aria-pressed=true],.nv[aria-current=page]{background:#0F6F69!important;color:#FFFFFF!important}\r\nbutton.btn,#login,button[type=submit],#menu{background:#0F6F69!important;color:#FFFFFF!important;border-color:#0F6F69!important}\r\nbutton.btn:hover,#login:hover,button[type=submit]:hover,#menu:hover{background:#0B504B!important;color:#FFFFFF!important}\r\nbutton.btn.ghost,button.btn.s,.btn.o,#app>.btn.ghost{background:var(--aa-surface)!important;color:var(--aa-accent)!important;border-color:var(--aa-border)!important}\r\nbutton.o,button.sp,.nt,.badge{background:var(--aa-surface)!important;color:var(--aa-text)!important}\r\nbutton.o:hover,button.sp:hover{border-color:var(--aa-accent)!important;background:var(--aa-soft)!important}\r\n.o.ok,.sp.seen,.pre label.on,.win,.alert.g{background:var(--aa-okbg)!important;color:var(--aa-oktext)!important;border-color:var(--aa-oktext)!important}\r\n.o.no,.alert.r,.ai.cx{background:var(--aa-nobg)!important;color:var(--aa-notext)!important;border-color:var(--aa-notext)!important}\r\n.strip,.alert.o,details{background:var(--aa-warnbg)!important;color:var(--aa-warntext)!important;border-color:#B78926!important}\r\n.alert{background:var(--aa-soft)!important;color:var(--aa-text)!important}\r\n.ov{background:var(--aa-surface)!important;color:var(--aa-danger)!important}\r\n.cnt{background:#A51D27;color:#FFFFFF!important}\r\n.badge:not(button){background:#18593B!important;color:#FFFFFF!important}\r\n.st.x{background:#A51D27!important;color:#FFFFFF!important}\r\n.st.live,.status-reviewed{background:#F4C95D!important;color:#513B00!important}\r\n.st.d,.status-resolved{background:#18593B!important;color:#FFFFFF!important}\r\n.status-received{background:#A51D27!important;color:#FFFFFF!important}\r\n.task.done label{color:var(--aa-oktext)!important}\r\n.task input:checked{background:#0F6F69!important;border-color:var(--aa-accent)!important}\r\n.task input:checked::after{color:#FFFFFF!important}\r\n#fill,.prog i,.bar i{background:var(--aa-progress)!important}\r\n.track,.prog,#app .bar{background:var(--aa-track)!important}\r\n#toast,.toast{background:#0B3B3A!important;color:#FFFFFF!important}\r\n.toast small{color:#E8F5F1!important;opacity:1}\r\n.nt.rd,.lk svg{opacity:1}\r\n#sidebar h2,#sidebar h3,#sidebar label,#leaderboard li{color:var(--aa-text)!important}\r\n#sidebar button:not(.leaflet-control button){background:#0F6F69;color:#FFFFFF}\r\n.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--aa-surface)!important;color:var(--aa-text)!important}\r\n.leaflet-control a,.leaflet-bar a{background:var(--aa-surface)!important;color:var(--aa-text)!important}\r\n.leaflet-container .leaflet-control-attribution{background:var(--aa-surface)!important;color:var(--aa-text)!important}\r\n.leaflet-control-attribution a{color:var(--aa-accent)!important}\r\n.leaflet-tooltip{background:var(--aa-surface)!important;color:var(--aa-text)!important;border-color:var(--aa-border)!important}\r\ndialog::backdrop{background:#04110FC4}\r\n.tag,.avatar{background:var(--aa-soft)!important;color:var(--aa-text)!important;border-color:var(--aa-border)!important}\r\n.medal{background:#0F6F69!important;color:#FFFFFF!important;border-color:var(--aa-surface)!important}\r\ntd:first-child,th,.tag,.badge-preview-controls label,.badge-unlock-popup p{color:var(--aa-muted)!important}\r\n.badge-unlock-popup,.badge-preview-controls,.floating-reward,.bonus-reward{background:var(--aa-surface)!important;color:var(--aa-text)!important;border-color:var(--aa-border)!important}\r\n.badge-preview-controls button{background:#0F6F69!important;color:#FFFFFF!important}\r\n[style*=\"color:var(--brand)\"]{color:var(--aa-accent)!important}\r\n#why{background:var(--aa-surface)!important;color:var(--aa-text)!important}\r\n.strip button,.strip small{color:var(--aa-warntext)!important}\r\n.alert.o small{color:var(--aa-warntext)!important}\r\n.alert.r small{color:var(--aa-notext)!important}\r\n.alert.g small{color:var(--aa-oktext)!important}\r\n.stat-icon{background:var(--aa-soft)!important;color:var(--aa-accent)!important}\r\n","body":"\u003cmain id=\"app\">\u003c/main>\r\n","js":"\r\nconst C=[\r\n{t:'Know your mosquito',d:'Which mosquitoes harm people, what their eggs look like, and how they grow.',\r\nL:[\r\n{t:'Meet the mosquito',b:`\u003cp>A mosquito is a tiny flying insect with a long, thin mouth called a proboscis. It is only a few millimetres long, but it is one of the most dangerous animals for people, because some mosquitoes carry germs from one person to another.\u003c/p>\u003cp>Only \u003cb>female\u003c/b> mosquitoes bite. They need the protein in blood to make their eggs. Male mosquitoes do not bite at all. They drink sweet plant juice, called nectar, like butterflies do.\u003c/p>\u003cp>There are thousands of kinds of mosquitoes in the world. Most are harmless to people. Only a few kinds spread diseases such as dengue and malaria, and you will meet them in this course.\u003c/p>\u003cp>The good news is that mosquitoes need water to start their life. If we remove the water, we can stop many of them before they ever fly.\u003c/p>`,q:['Which mosquitoes bite people?',['Only males','Only females','Both equally'],1,'Only females need blood to develop eggs.']},\r\n{t:'Three genera to know',b:`\u003cp>Scientists group mosquitoes into families called \u003cb>genera\u003c/b> (one is a genus). Three genera matter most for human health in Malaysia. Learning to tell them apart helps you know which disease to watch for.\u003c/p>\u003cp>Remember: a mosquito only spreads a disease if it first bit an infected person. Most mosquitoes that bite you are not infected, but you cannot tell by looking.\u003c/p>`,q:['A black mosquito with white leg stripes bites you at 4 pm. Which genus is most likely?',['Aedes','Anopheles','Culex'],0,'Aedes, the dengue mosquito, is striped and bites in the daytime.']},\r\n{t:'The life cycle',b:`\u003cp>A mosquito goes through four stages in its life. This is called the \u003cb>life cycle\u003c/b>.\u003c/p>\u003cp>In warm weather the whole cycle takes about 7 to 10 days. This is the most important number in the course. If you empty the water every week, the wrigglers never become flying mosquitoes. Drag the slider below to follow the stages day by day.\u003c/p>`,q:['Which stages need water?',['Only the adult','Egg, larva and pupa','Only the egg'],1,'The egg, larva and pupa all depend on water, so removing standing water stops the breeding.']},\r\n{t:'What the eggs look like',b:`\u003cp>Knowing what mosquito eggs look like helps you find them before they hatch. Each type lays its eggs in a different way.\u003c/p>\u003cp>Aedes eggs are very tough. They can stay dry for months, and they hatch as soon as rain or new water covers them. That is why pouring out the water is not enough. You must also scrub the walls. Tap each mosquito below to see where its eggs are.\u003c/p>`,q:['You see a small black raft of eggs floating on a puddle. Which genus?',['Aedes','Culex','Anopheles'],1,'Culex lays floating rafts. Aedes eggs are single specks on the wall.']},\r\n{t:'Who bites, and when',b:`\u003cp>Different mosquitoes bite at different times, so you need protection at different times of the day.\u003c/p>\u003cp>You cannot tell if a mosquito carries a disease by looking at it. So the safest habit is to protect yourself all day: wear long sleeves in the daytime, use repellent, and keep doors and windows screened.\u003c/p>\u003cp>Move the slider below to see which mosquitoes are active at each hour.\u003c/p>`,q:['When should you protect yourself from dengue mosquitoes?',['Only at night','Mainly during the day','Never indoors'],1,'Aedes bites mainly in the daytime, including indoors.']}],\r\nF:[\r\n['Which genus spreads dengue?',['Aedes','Culex','Anopheles'],0,'Aedes aegypti and Aedes albopictus spread dengue.'],\r\n['Which genus is linked with malaria?',['Anopheles','Aedes','Culex'],0,'Anopheles carries malaria parasites.'],\r\n['How long does the life cycle take in warm weather?',['About 1 day','About 7 to 10 days','About 3 months'],1,'Roughly 7 to 10 days, which is why weekly checks work.'],\r\n['Where does Aedes lay its eggs?',['In a raft on the surface','On leaves far from water','On the container wall just above the waterline'],2,'Eggs stick singly just above the waterline and hatch when water rises.'],\r\n['Why do female mosquitoes bite?',['To drink nectar','To get blood for developing eggs','To mark territory'],1,'Blood supplies protein for egg development.']]},\r\n{t:'Where they breed',d:'The indoor, outdoor and community places where mosquitoes lay eggs.',\r\nL:[\r\n{t:'What a mosquito needs',b:`\u003cp>Mosquitoes simply lay their eggs wherever they find \u003cb>still water\u003c/b>. That can be a big pond or something as small as a bottle cap with rainwater inside.\u003c/p>\u003cp>Different mosquitoes like different water. Aedes (dengue) prefer clean, still water in shady places close to homes. Culex like dirty water, such as in blocked drains. Anopheles like clean water in places such as streams, ponds and swamps, often away from town.\u003c/p>\u003cp>Time is also important. Water that sits still for 7 days or more is long enough for eggs to grow into new flying mosquitoes. Moving water, covered water and dry containers do not give them a good place to start.\u003c/p>\u003cp>Drag the slider below to see what happens as water stays still for longer.\u003c/p>`,q:['Which is the biggest warning sign for breeding?',['Strong wind','Still water left for over a week','Direct sunlight'],1,'Water that stands for a week or more can grow a new generation.']},\r\n{t:'Inside the home',b:`\u003cp>Many people think mosquitoes breed only outside, but the Aedes mosquito often breeds inside the home. Anything that holds water for a week can be a breeding site, even if it is small and hidden.\u003c/p>\u003cp>Common places are flower vases, the drip tray of a water dispenser or fridge, the drip tray under an air-conditioner, buckets and tanks in the bathroom, saucers under plant pots and pet water bowls. They are easy to forget because we see them every day.\u003c/p>\u003cp>Check these places once a week. Pour out the water, scrub the sides and refill with fresh water if needed.\u003c/p>`,q:['Which is an indoor breeding site?',['A dry floor','A closed cupboard','A flower vase with old water'],2,'Vase water that is not changed often is a classic site.']},\r\n{t:'Around the house and street',b:`\u003cp>Outside, rain is the biggest helper for mosquitoes. After a storm, water collects in all kinds of things that people have thrown away or forgotten.\u003c/p>\u003cp>Look for old tyres, empty cans, bottles, plastic cups and food boxes, blocked drains and roof gutters, plant pots, folds in plastic sheets and hollow bamboo stumps. A single old tyre can hold rainwater for weeks and breed many mosquitoes.\u003c/p>\u003cp>Many of these places are easy to fix. Throw rubbish away properly, turn containers upside down and keep drains clear.\u003c/p>`,q:['After heavy rain, which is a common risk?',['Clean dry pavements','Closed windows','Old tyres filled with water'],2,'Tyres hold rainwater for weeks.']},\r\n{t:'Shared and public places',b:`\u003cp>Mosquitoes do not stop at your fence. A neglected place in your neighbourhood can send mosquitoes into many homes, because they can fly to nearby houses.\u003c/p>\u003cp>Watch for construction sites with puddles and open drums, empty land with piles of rubbish, bin areas, recycling points where cans and bottles collect rain, and ponds or drains that nobody cleans.\u003c/p>\u003cp>These shared places are easy to overlook because nobody feels they own the problem. That is why community action and reporting matter. If you see one, tell the owner, the residents' committee or the local council.\u003c/p>`,q:['Why do open recycling bins need lids?',['Lids make bins heavier','Rain collects in the cans and bottles inside','Mosquitoes eat paper'],1,'Rain fills cans and bottles inside the bin and creates breeding sites.']}],\r\nF:[\r\n['Which place is most likely to breed Aedes?',['A sealed tank with a tight lid','A plant saucer with old water','A dry rooftop'],1,'Aedes breed in small pools of still water near homes.'],\r\n['Culex mosquitoes are most associated with...',['Blocked drains with dirty water','Dry sand','Fast-flowing rivers'],0,'Culex tolerate dirty, still water.'],\r\n['How often should water in vases and trays be emptied?',['Once a month','Only when it smells','At least every 7 days'],2,'Weekly emptying breaks the 7 to 10 day cycle.'],\r\n['Which is NOT a likely breeding site?',['Discarded cup holding rainwater','Blocked roof gutter','Clean dry floor tiles'],2,'Without standing water there is nothing to breed in.']]},\r\n{t:'Stop the breeding',d:'Simple habits that keep your home and neighbourhood mosquito-free.',\r\nL:[\r\n{t:'Empty, scrub, cover',b:`\u003cp>The best way to stop mosquitoes is to stop them breeding. There are three simple steps for any container that holds water: \u003cb>empty it, scrub it and cover it\u003c/b>.\u003c/p>`,q:['Why scrub container walls?',['To make them shiny','Eggs stick to the wall and survive a quick rinse','Scrubbing kills adults'],1,'Eggs cling to the wall and can hatch later if left behind.']},\r\n{t:'Drains, gutters and rubbish',b:`\u003cp>Some breeding sites are not containers you can pour out. They are places where water cannot flow or where rubbish holds water.\u003c/p>`,q:['What stops drains becoming breeding sites?',['Letting leaves collect','Covering them with plastic','Clearing blockages so water flows'],2,'Flowing water leaves no still pool for eggs.']},\r\n{t:'Protect yourself and report',b:`\u003cp>Even with good habits, some mosquitoes will still be around. So protect yourself and help your community.\u003c/p>`,q:['You have a fever, severe headache and joint pain after mosquito bites. What now?',['See a doctor early','Wait two weeks','Ignore it'],0,'Early medical care matters for dengue.']}],\r\nF:[\r\n['Which habit best breaks the breeding cycle?',['A weekly check that empties standing water','Spraying perfume','Closing curtains'],0,'Removing water every week stops larvae maturing.'],\r\n['How should you clean a water container?',['Rinse quickly and refill','Scrub the walls, then empty or cover it','Add more water'],1,'Scrubbing removes the sticky eggs.'],\r\n['Who should you report a neglected breeding site to?',['A neighbour\\'s pet','A shop','The local council or health office'],2,'Authorities can inspect and clear shared sites.'],\r\n['Which protects you from bites?',['Leaving doors open','Window screens and repellent','Wearing shorts outdoors'],1,'Physical barriers and repellent reduce bites.']]}\r\n];\r\nconst $=s=>document.querySelector(s),A=$('#app');\r\nlet P={l:{},f:{}},S={};\r\ntry{const saved=JSON.parse(localStorage.getItem('mba'));if(saved&&typeof saved==='object'&&!Array.isArray(saved)){P={...saved,l:saved.l&&typeof saved.l==='object'&&!Array.isArray(saved.l)?saved.l:{},f:saved.f&&typeof saved.f==='object'&&!Array.isArray(saved.f)?saved.f:{}};}}catch(e){}\r\nconst save=()=>{try{localStorage.setItem('mba',JSON.stringify(P))}catch(e){}};\r\nconst nl=i=>C[i].L.filter((_,j)=>P.l[i+'-'+j]).length;\r\nconst go=h=>{A.innerHTML=h;A.classList.toggle('wide',h.includes('class=\"big\"'));window.scrollTo(0,0)};\r\nconst qbox=q=>`\u003cdiv>${q[0].length?`\u003ch3>${q[0]}\u003c/h3>`:''}${q[1].map((o,k)=>`\u003cbutton class=\"o\" onclick=\"pick(${k})\">${o}\u003c/button>`).join('')}\u003cp id=\"why\" hidden>\u003c/p>\u003c/div>`;\r\nfunction pick(k){if(S.done)return;S.done=1;const q=S.cur,ok=k==q[2];\r\ndocument.querySelectorAll('.o').forEach((b,x)=>{b.disabled=true;if(x==q[2])b.classList.add('ok');else if(x==k)b.classList.add('no')});\r\nconst w=$('#why');w.hidden=false;w.textContent=(ok?'Correct. ':'Not quite. ')+q[3];\r\nS.after&&S.after(ok);$('#nx').hidden=false}\r\nfunction home(){\r\nconst tot=C.reduce((a,c)=>a+c.L.length+1,0),done=C.reduce((a,c,i)=>a+nl(i)+(P.f[i]>=70?1:0),0),p=Math.round(done/tot*100),all=C.every((_,i)=>P.f[i]>=70);\r\ngo(`\u003cdiv class=\"hero\">\u003cdiv>\u003ch1>Course\u003c/h1>\u003cp class=\"mut\">Three short courses to spot, stop and prevent mosquito breeding in your community.\u003c/p>\u003c/div>\u003c/div>${all?'\u003cdiv class=\"card win\">\u003ch2>You are a Mosquito Buster!\u003c/h2>\u003cp>All 3 courses passed. Share what you learned with your neighbours.\u003c/p>\u003c/div>':''}\r\n\u003cdiv class=\"big\">${C.map((c,i)=>{const n=nl(i),t=c.L.length;return `\u003cdiv class=\"card\" role=\"button\" tabindex=\"0\" onclick=\"lesson(${i},0)\" onkeydown=\"if(event.key=='Enter')lesson(${i},0)\">\u003cdiv class=\"row\">\u003ch2>Course ${i+1}: ${c.t}\u003c/h2>${P.f[i]>=70?'\u003cspan class=\"badge\">Passed\u003c/span>':''}\u003c/div>\u003cp>${c.d}\u003c/p>\u003cdiv class=\"bar\">\u003ci style=\"width:${n/t*100}%\">\u003c/i>\u003c/div>\u003cdiv class=\"row\" style=\"margin-top:12px\">\u003csmall>${n} of ${t} lessons${P.f[i]!=null?', best quiz '+P.f[i]+'%':''}\u003c/small>\u003cspan aria-hidden=\"true\">›\u003c/span>\u003c/div>\u003c/div>`}).join('')}\u003c/div>\r\n`)}\r\n\r\nfunction course(i){const c=C[i],ok=nl(i)==c.L.length;\r\ngo(`\u003cbutton class=\"back\" onclick=\"home()\">‹ All courses\u003c/button>\u003ch1>${c.t}\u003c/h1>\u003cp class=\"mut\">${c.d}\u003c/p>\r\n${c.L.map((l,j)=>`\u003cbutton class=\"o\" onclick=\"lesson(${i},${j})\">${P.l[i+'-'+j]?'✓ ':''}Lesson ${j+1}: ${l.t}\u003c/button>`).join('')}\r\n\u003cbutton class=\"o fin\" ${ok?'':'disabled'} onclick=\"quiz(${i})\">Final quiz: ${c.F.length} questions, pass at 70%${ok?'':' (finish all lessons first)'}\u003c/button>`)}\r\nfunction lesson(i,j){const l=C[i].L[j],last=j==C[i].L.length-1;\r\nS={cur:l.q,done:0,after:()=>{P.l[i+'-'+j]=1;save()}};\r\ngo(`\u003cbutton class=\"back\" onclick=\"course(${i})\">‹ ${C[i].t}\u003c/button>\u003ch1>${l.t}\u003c/h1>\u003cdiv class=\"card\">${l.b}\u003c/div>${qbox(l.q)}\u003cbutton id=\"nx\" class=\"btn\" hidden onclick=\"${last?`course(${i})`:`lesson(${i},${j+1})`}\">${last?'Back to course':'Next lesson'}\u003c/button>`)}\r\nfunction quiz(i,n=0,s=0){const c=C[i],len=c.F.length;\r\nif(n==len){const pc=Math.round(s/len*100);P.f[i]=Math.max(P.f[i]||0,pc);save();\r\nreturn go(`\u003ch1>${pc>=70?'Passed!':'Not yet'}\u003c/h1>\u003cdiv class=\"card\">\u003ch2>${s} of ${len} correct (${pc}%)\u003c/h2>\u003cp>${pc>=70?'You earned the badge for '+c.t+'.':'You need 70% to pass. Review the lessons and try again.'}\u003c/p>\u003c/div>\u003cbutton class=\"btn\" onclick=\"${pc>=70?'home()':`quiz(${i})`}\">${pc>=70?'Back to courses':'Retry quiz'}\u003c/button> \u003cbutton class=\"btn ghost\" onclick=\"course(${i})\">Review lessons\u003c/button>`)}\r\nS={cur:c.F[n],done:0,i,n,s,after:ok=>{if(ok)S.s++}};\r\ngo(`\u003cbutton class=\"back\" onclick=\"course(${i})\">‹ Leave quiz\u003c/button>\u003cp class=\"mut\">Question ${n+1} of ${len}\u003c/p>${qbox(c.F[n])}\u003cbutton id=\"nx\" class=\"btn\" hidden onclick=\"quiz(S.i,S.n+1,S.s)\">${n==len-1?'See result':'Next question'}\u003c/button>`)}\r\nlet SP=[],SL=[],SLH=0;\r\nconst spots=it=>{SP=it;return `\u003cp class=\"mut\">Tap each one to learn more. Found \u003cb id=\"cnt\">0\u003c/b> of ${it.length}.\u003c/p>\u003cdiv class=\"grid\">${it.map((x,k)=>`\u003cbutton class=\"sp\" onclick=\"sp(this,${k})\">${x[0]}\u003c/button>`).join('')}\u003c/div>\u003cdiv class=\"tip\" id=\"tip\">Tap an item above.\u003c/div>`};\r\nfunction sp(b,k){b.classList.add('seen');$('#tip').textContent=SP[k][1];const n=document.querySelectorAll('.sp.seen').length;$('#cnt').textContent=n;if(n==SP.length)$('#tip').textContent+=' All found!'}\r\nconst slide=(lab,mn,mx,st,fmt)=>{SL=st;SLH=fmt;return `\u003clabel>${lab}: \u003cb id=\"sv\">\u003c/b>\u003c/label>\u003cinput type=\"range\" min=\"${mn}\" max=\"${mx}\" value=\"${mn}\" aria-label=\"${lab}\" oninput=\"sl(this.value)\">\u003cdiv class=\"tip\" id=\"so\">\u003c/div>`};\r\nfunction sl(v){v=+v;$('#sv').textContent=SLH?v+':00':'Day '+v;$('#so').textContent=SL.filter(s=>s[0]\u003c=v).pop()[1]}\r\nconst eggW=()=>`\u003cdiv class=\"tabs\">\u003cbutton class=\"sp\" onclick=\"egg(0)\">Aedes\u003c/button>\u003cbutton class=\"sp\" onclick=\"egg(1)\">Culex\u003c/button>\u003cbutton class=\"sp\" onclick=\"egg(2)\">Anopheles\u003c/button>\u003c/div>\u003csvg id=\"egs\" viewBox=\"0 0 220 100\" width=\"100%\" role=\"img\" aria-label=\"Where each genus lays eggs\">\u003c/svg>\u003cdiv class=\"tip\" id=\"egt\">\u003c/div>`;\r\nfunction egg(g){let d='';\r\nif(g==0)for(const x of [34,62,96,130,166])d+=`\u003ccircle cx=\"${x}\" cy=\"43\" r=\"3.5\" fill=\"currentColor\"/>`;\r\nif(g==1)for(let r=0;r\u003c2;r++)for(let c=0;c\u003c10;c++)d+=`\u003cellipse cx=\"${82+c*6}\" cy=\"${50+r*5}\" rx=\"2.5\" ry=\"3\" fill=\"currentColor\"/>`;\r\nif(g==2)for(const x of [60,90,118,150])d+=`\u003cellipse cx=\"${x}\" cy=\"51\" rx=\"4\" ry=\"2.5\" fill=\"currentColor\"/>`;\r\n$('#egs').innerHTML=`\u003crect x=\"20\" y=\"10\" width=\"180\" height=\"80\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\"/>\u003crect x=\"23\" y=\"53\" width=\"174\" height=\"34\" fill=\"var(--water)\" opacity=\".7\"/>`+d;\r\n$('#egt').textContent=['Aedes lays eggs one by one. Each egg is tiny, about 1 mm long, black and oval, like a speck of pepper. The eggs are stuck to the wall of the container, just above the water line. They are very hard to see.','Culex lays 100 or more eggs together, stuck side by side in a floating group called a raft. It looks like a tiny dark boat on the water.','Anopheles lays single eggs that float on the water surface. Each egg has small air-filled floats on its sides.'][g]||'Tap a mosquito above to see where its eggs are.';\r\ndocument.querySelectorAll('.tabs .sp').forEach((b,x)=>b.classList.toggle('seen',x==g))}\r\nconst ckW=it=>{SP=it;return `\u003cp class=\"mut\">Tick each item as you check it. \u003cb id=\"cnt\">0\u003c/b> of ${it.length} done.\u003c/p>`+it.map(t=>`\u003clabel class=\"ck\">\u003cinput type=\"checkbox\" onchange=\"ck()\">${t}\u003c/label>`).join('')+`\u003cdiv class=\"tip\" id=\"tip\">\u003c/div>`};\r\nfunction ck(){const n=document.querySelectorAll('.ck input:checked').length;$('#cnt').textContent=n;$('#tip').textContent=n==SP.length?'All clear. Repeat this next week.':''}\r\nconst X={\r\n'0-1':()=>['\u003cp>Tap each mosquito box below to read how it looks, when it bites and what disease it spreads.\u003c/p>',spots([['Aedes','The dengue mosquito. It also spreads chikungunya and Zika. It is black with white stripes on its legs, and some people call it the tiger mosquito. It bites in the daytime and often lives inside and around homes.'],['Anopheles','Spreads malaria. When it rests, its rear end points up in the air. It bites from dusk until dawn and is often found near forests, streams and swamps.'],['Culex','Spreads filariasis (a disease that makes the legs swell) and Japanese encephalitis (a brain infection). It is brownish and bites at night. It likes dirty water, such as blocked drains.']])],\r\n'0-2':()=>['\u003cp>Tap each stage to read about it, then drag the slider to follow the days.\u003c/p>',spots([['Egg','The female lays tiny eggs on or near water. When water covers the eggs, they hatch in about 1 to 3 days.'],['Larva (wriggler)','A small worm-like creature that swims with a wriggling movement. It eats tiny bits of food in the water and comes up to the surface to breathe. This stage lasts about 4 to 6 days.'],['Pupa (tumbler)','It stops eating and rolls around in the water while its body changes. This lasts 1 to 2 days.'],['Adult','The new mosquito splits its skin, rests on the water for a short time, then flies away.']])+slide('Days since eggs touched water',0,10,[[0,'Egg: eggs covered by water start to hatch within 1 to 3 days.'],[3,'Larva (wriggler): feeds, grows and comes up to breathe. About 4 to 6 days.'],[7,'Pupa (tumbler): stops feeding and changes into an adult. About 1 to 2 days.'],[9,'Adult: a new mosquito flies out. Removing the water before this day stops it.']])],\r\n'0-3':()=>[0,eggW()],\r\n'0-4':()=>['\u003cp>Tap each box to read, then move the slider to see which mosquitoes are active at each hour.\u003c/p>',spots([['Aedes (dengue)','Bites mainly in the daytime. The busiest times are early morning and late afternoon. It likes shady places and often bites around the ankles and legs. It can bite you inside your own home.'],['Anopheles and Culex','Both bite from dusk, through the evening and at night. Anopheles spreads malaria and Culex spreads filariasis and Japanese encephalitis, so use nets and screens at night.']])+slide('Time of day',0,23,[[0,'Night: Culex and Anopheles are active. Aedes mostly rests.'],[5,'Early morning: Aedes starts biting and peaks.'],[10,'Daytime: Aedes still bites, often in shade and indoors.'],[16,'Late afternoon: Aedes peaks again.'],[19,'Dusk and evening: Culex and Anopheles start biting.']],1)],\r\n'1-0':()=>[0,slide('Days water stands still',0,10,[[0,'Fresh water. Low risk if you empty it soon.'],[2,'Eggs may be hatching in the water.'],[4,'Wrigglers are growing. Empty and scrub now.'],[8,'Adults are about to fly out. Too late for this batch.']])],\r\n'1-1':()=>['\u003cp>Walk through a home. Tap each place to see why it breeds mosquitoes and the fix.\u003c/p>',spots([['Flower vase','Water in a vase can stay for days. Change it every few days and scrub the sides, because eggs can stick to the glass.'],['Dispenser tray','The small tray under a water dispenser or fridge collects drips and is often forgotten. Empty and wipe it at least once a week.'],['Air-con tray','Water drips from an air-conditioner into a tray or pipe. If it does not drain well, it becomes a breeding place. Check and clean it regularly.'],['Bathroom bucket','Buckets and tanks that hold water for days are perfect for Aedes. Turn the bucket upside down when not in use and cover any tank.'],['Plant saucer','The dish under a plant pot fills with water after watering. Do not leave water standing in it, and empty it every few days.'],['Pet bowl','Pets need water, but old water breeds mosquitoes. Rinse the bowl and refill it with fresh water every day.']])],\r\n'1-2':()=>['\u003cp>Now step outside. Tap each place to see the risk and the fix.\u003c/p>',spots([['Old tyre','A tyre is a perfect cup for rain, and it can hold water for weeks. Store tyres under cover, or drill drain holes in them.'],['Roof gutter','Leaves and mud block the gutter so rainwater stays in it. Clear the gutter regularly so water can flow away.'],['Blocked drain','Still, dirty water in a blocked drain is the favourite place of Culex. Keep drains clear so water keeps moving.'],['Discarded can','Even a small can or cup can hold enough rain for mosquitoes to breed. Put rubbish in a bin and crush cans.'],['Tarpaulin fold','Plastic sheets have folds and low spots where rain collects. Stretch them tight or shake the water out after rain.'],['Bamboo stump','A hollow bamboo stump fills with rain like a small cup. Cut it open or fill it with soil.']])],\r\n'1-3':()=>['\u003cp>Shared spaces are easy to overlook because nobody feels responsible. Tap each one.\u003c/p>',spots([['Construction site','Puddles, open drums and uncovered pipes collect water. Ask the site manager to drain and cover them, and check after rain.'],['Empty lot','Piles of rubbish hold rainwater and can breed many mosquitoes. Report it to the owner or the local council.'],['Recycling bin','Open bins with cans and bottles fill with rain. Use lids, empty the containers before binning and keep the area clean.'],['Neglected pond','A pond with no care and still water breeds mosquitoes. Report it, or stock larvae-eating fish such as guppies.']])],\r\n'2-0':()=>['\u003cp>Tap each step to read how to do it.\u003c/p>',spots([['Empty','Pour out the water. Do not just top it up, because old water may already contain eggs or wrigglers.'],['Scrub','Use a brush on the walls and rinse. Aedes eggs stick tightly to the wall and survive a quick rinse, so scrubbing removes them.'],['Cover or flip','Turn buckets, pots and bottles upside down, and put tight lids or fine mesh over tanks and drums that must hold water.'],['Old tyres','Store old tyres under cover or drill drain holes in them so they cannot hold rain.']])],\r\n'2-1':()=>['\u003cp>Tap each habit to read more.\u003c/p>',spots([['Clear drains','Keep drains clear of leaves, mud and plastic so rainwater flows away quickly. Moving water gives mosquitoes no place to lay eggs.'],['Clear gutters','Remove leaves from roof gutters often, especially after storms, so water does not sit in them.'],['Bin rubbish','Put rubbish in a bag and bin it, and crush cans and bottles so they cannot hold water.'],['Level puddles','Fill holes and low spots in the ground so puddles do not stay for days.'],['Pond fish','In a garden pond or large water tank that you want to keep, add small fish such as guppies. They eat the wrigglers.']])],\r\n'2-2':()=>['\u003cp>Tap each item to read more.\u003c/p>',spots([['Repellent','Use repellent that contains DEET or picaridin on skin that is not covered, and follow the label.'],['Cover up','Wear long sleeves and long trousers, especially in the daytime when Aedes bites.'],['Screens and nets','Fit screens on windows and doors, and sleep under a net where needed.'],['Larvicide','A product that kills wrigglers. Use it only as advised by the health authorities.'],['Report','If you see a neglected place that breeds mosquitoes, tell the local council or health office.'],['See a doctor','Fever with a severe headache, pain behind the eyes, joint pain or a rash may be dengue. See a doctor early.']])]};\r\nconst W='stroke=\"currentColor\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\"';\r\nconst fig=(s,c)=>`\u003cfigure class=\"fig\">${s}\u003cfigcaption>${c}\u003c/figcaption>\u003c/figure>`;\r\nconst mos=(x,r,dash,lab)=>`\u003cg transform=\"translate(${x} 88) rotate(${r})\">\u003cellipse cx=\"24\" cy=\"-17\" rx=\"24\" ry=\"5\" fill=\"currentColor\"/>\u003ccircle cx=\"-2\" cy=\"-17\" r=\"5\" fill=\"currentColor\"/>\u003cpath d=\"M-6 -14L-16 -1\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003cpath d=\"M10 -14L5 0M22 -14L24 0M34 -14L44 0\" stroke=\"currentColor\" stroke-width=\"2\" fill=\"none\"${dash?' stroke-dasharray=\"4 3\"':''}/>\u003cellipse cx=\"30\" cy=\"-25\" rx=\"18\" ry=\"3\" fill=\"none\" stroke=\"currentColor\" opacity=\".6\"/>\u003c/g>\u003ctext x=\"${x+22}\" y=\"108\" text-anchor=\"middle\">${lab}\u003c/text>`;\r\nconst FIG={\r\n'0-2':fig(`\u003csvg viewBox=\"0 0 360 120\" role=\"img\" aria-label=\"Life cycle: egg, larva, pupa, adult\">\u003crect x=\"0\" y=\"66\" width=\"262\" height=\"54\" fill=\"var(--water)\" opacity=\".55\"/>\u003cg fill=\"currentColor\">\u003cellipse cx=\"40\" cy=\"96\" rx=\"4\" ry=\"2.5\"/>\u003cellipse cx=\"50\" cy=\"100\" rx=\"4\" ry=\"2.5\"/>\u003cellipse cx=\"45\" cy=\"90\" rx=\"4\" ry=\"2.5\"/>\u003ccircle cx=\"108\" cy=\"92\" r=\"4.5\"/>\u003cellipse cx=\"205\" cy=\"90\" rx=\"8\" ry=\"10\"/>\u003cellipse cx=\"310\" cy=\"32\" rx=\"16\" ry=\"4\"/>\u003ccircle cx=\"292\" cy=\"32\" r=\"4.5\"/>\u003c/g>\u003cpath d=\"M112 92q9-10 18 0t18 0\" ${W}/>\u003cpath d=\"M210 98q10 6 14-4\" ${W}/>\u003cpath d=\"M302 28q8-16 22-12M300 36l-6 14M310 36l2 15M318 35l10 12\" stroke=\"currentColor\" stroke-width=\"2\" fill=\"none\"/>\u003ctext x=\"45\" y=\"40\" text-anchor=\"middle\">Egg\u003c/text>\u003ctext x=\"45\" y=\"54\" text-anchor=\"middle\">1 to 3 days\u003c/text>\u003ctext x=\"128\" y=\"40\" text-anchor=\"middle\">Larva\u003c/text>\u003ctext x=\"128\" y=\"54\" text-anchor=\"middle\">4 to 6 days\u003c/text>\u003ctext x=\"208\" y=\"40\" text-anchor=\"middle\">Pupa\u003c/text>\u003ctext x=\"208\" y=\"54\" text-anchor=\"middle\">1 to 2 days\u003c/text>\u003ctext x=\"310\" y=\"72\" text-anchor=\"middle\">Adult\u003c/text>\u003ct
