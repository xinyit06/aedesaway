l\" aria-label=\"Notifications\" aria-expanded=\"false\">\u003csvg class=\"ic\">\u003cuse href=\"#i-bell\"/>\u003c/svg>\u003cspan class=\"cnt\" id=\"ncnt\">3\u003c/span>\u003c/button>\r\n\u003cdiv class=\"pop\" id=\"pop\" hidden>\u003cdiv id=\"nlist\">\u003c/div>\u003c/div>\u003c/div>\r\n\u003cbutton class=\"btn\" id=\"login\">Login\u003c/button>\r\n\u003cbutton class=\"ib\" id=\"menu-btn\" aria-label=\"Open menu\" aria-expanded=\"false\">\u003csvg class=\"ic\" id=\"mi\">\u003cuse href=\"#i-menu\"/>\u003c/svg>\u003c/button>\r\n\u003c/div>\u003c/div>\u003c/header>\r\n\r\n\u003cmain>\r\n\u003csection class=\"view\" id=\"v-home\">\r\n\u003cdiv class=\"hero\">\u003ch1>A safer neighbourhood \u003cem>starts with us.\u003c/em>\u003c/h1>\u003cp class=\"sub\">Stay informed. Take action. Prevent dengue together.\u003c/p>\r\n\u003cdiv class=\"row\">\u003cbutton class=\"btn\" data-go=\"fogalert\">Open FogAlert\u003c/button>\u003cbutton class=\"btn o\" data-go=\"map\">Report a breeding site\u003c/button>\u003c/div>\u003c/div>\r\n\u003cdiv class=\"strip\">\u003csvg class=\"ic\" width=\"30\" height=\"30\">\u003cuse href=\"#i-horn\"/>\u003c/svg>\u003cdiv>\u003cb>Upcoming fogging\u003c/b>24 October • 5:30 PM • Jalan Murni 1–4 (sample)\u003c/div>\u003cbutton data-go=\"fogalert\">View alert \u003csvg class=\"ic\" width=\"18\" height=\"18\">\u003cuse href=\"#i-arr\"/>\u003c/svg>\u003c/button>\u003c/div>\r\n\u003cdiv class=\"g4\">\r\n\u003cbutton class=\"fn\" data-go=\"fogalert\" style=\"--c:#0f6f69\">\u003cspan class=\"t\">\u003csvg class=\"ic\" width=\"28\" height=\"28\">\u003cuse href=\"#i-mos\"/>\u003c/svg>\u003c/span>\u003ch3>FogAlert\u003c/h3>\u003cp>Fogging Alarm &amp; Live Tracker\u003c/p>\u003cspan class=\"go\">Open \u003csvg class=\"ic\" width=\"18\" height=\"18\">\u003cuse href=\"#i-arr\"/>\u003c/svg>\u003c/span>\u003c/button>\r\n\u003cbutton class=\"fn\" data-go=\"map\" style=\"--c:#1b5fae\">\u003cspan class=\"t\">\u003csvg class=\"ic\" width=\"28\" height=\"28\">\u003cuse h ,observe){\r\n const key='aedesaway:achievement-views:v1';\r\n const counter=button?.querySelector('.cnt');\r\n if(!button||!collection||!counter)return;\r\n let viewed=new Set();\r\n function load(){try{const saved=JSON.parse(storage.getItem(key));if(Array.isArray(saved?.viewed))viewed=new Set(saved.viewed.filter(id=>typeof id==='string'));}catch{}}\r\n function unlocked(){return [...collection.querySelectorAll('[data-b]:not(.lk)')].map(item=>item.querySelector('span')?.textContent.trim()).filter(Boolean);}\r\n function render(){const count=unlocked().filter(id=>!viewed.has(id)).length;counter.textContent=String(count);counter.hidden=count===0;}\r\n function markViewed(){load();unlocked().forEach(id=>viewed.add(id));try{storage.setItem(key,JSON.stringify({viewed:[...viewed]}));}catch{}render();}\r\n load();render();\r\n button.addEventListener('click',markViewed);\r\n eventTarget.addEventListener('storage',event=>{if(event.key===key){load();render();}});\r\n if(observe)observe(collection,render);\r\n return {render};\r\n})(document.getElementById(\"badge-btn\"),document.getElementById(\"bgrid\"),{getItem:key=>localStorage.getItem(key),setItem:(key,value)=>localStorage.setItem(key,value)},window,(target,render)=>new MutationObserver(render).observe(target,{childList:true,subtree:true,attributes:true,attributeFilter:[\"class\"]}));\r\n\n;\n\n(()=>{\nconst key='aedesaway:earned-badges:v1', grid=$('bgrid');\nlet saved=[];try{const value=JSON.parse(localStorage.getItem(key));if(Array.isArray(value))saved=value.filter(name=>B.some(b=>b[0]===name));}catch{}\nconst earned=new Set([...B.filter(b=>b[1]).map(b=>b[0]),...saved]);\nfunction persist(){try{localStorage.setItem(key,JSON.stringify([...earned]));}catch{}}\n// Restore silently. Demo defaults are preserved, and no requirements are invented.\nB.forEach((b,i)=>{if(earned.has(b[0])){b[1]=1;const tile=grid.querySelector('[data-b=\"'+i+'\"]');tile.classList.remove('lk');tile.querySelector('small').textContent='✓ Unlocked';}});\n$('bcount').textContent=earned.size+' / '+B.length+' earned';persist();\nconst queue=[];let active=null,timer=null,lastFocus=null;\nfunction finish(){if(!active)return;clearTimeout(timer);active.remove();active=null;if(queue.length)showNext();else {if(lastFocus?.isConnected)lastFocus.focus({preventScroll:true});lastFocus=null;}}\nfunction showNext(){if(active||!queue.length)return;const item=queue.shift(),b=B[item.index];if(!lastFocus)lastFocus=document.activeElement;\nconst overlay=document.createElement('div');overlay.className='badge-party';overlay.innerHTML='\u003csection class=\"badge-party-card\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"badge-party-title\" aria-describedby=\"badge-party-description\">\u003cbutton type=\"button\" class=\"badge-party-close\" aria-label=\"Close badge celebration\">×\u003c/button>\u003cdiv class=\"badge-party-particles\" aria-hidden=\"true\">\u003c/div>\u003cspan class=\"badge-party-art\">'+art(b)+'\u003c/span>\u003cp class=\"badge-party-kicker\">Achievement Unlocked!\u003c/p>\u003ch2 id=\"badge-party-title\">'+b[0]+'\u003c/h2>\u003cp id=\"badge-party-description\">'+b[6]+'\u003c/p>'+'\u003cp class=\"badge-party-note\">A little care. A lovely achievement! ✨\u003c/p>'+'\u003c/section>';\nconst particles=overlay.querySelector('.badge-party-particles');for(let i=0;i\u003c38;i++){const p=document.createElement('i');if(i%4===0){p.className='sparkle';p.textContent='✦';}p.style.setProperty('--particle',['#ffbd59','#ff7ca7','#78d9c4','#a69cff','#f7db65'][i%5]);p.style.setProperty('--dx',(Math.random()*340-170)+'px');p.style.setProperty('--dy',(Math.random()*300-130)+'px');p.style.setProperty('--spin',(Math.random()*720-360)+'deg');p.style.setProperty('--delay',Math.random()*.4+'s');particles.append(p);}\nactive=overlay;document.body.append(overlay);overlay.querySelector('button').addEventListener('click',finish);overlay.addEventListener('click',e=>{if(e.target===overlay)finish();});overlay.querySelector('button').focus({preventScroll:true});timer=setTimeout(finish,5200);\n}\ndocument.addEventListener('keydown',e=>{if(!active)return;if(e.key==='Escape'){e.preventDefault();e.stopImmediatePropagation();finish();}else if(e.key==='Tab'){e.preventDefault();active.querySelector('button').focus();}},true);\n// Real feature modules emit this only AFTER checking their achievement requirement.\n// There is deliberately no UI, CSS observer, page-load award, or demo trigger.\nwindow.addEventListener('aedesaway:achievement-earned',event=>{\n const result=event.detail;\n if(!result || result.requirementMet!==true)return;\n const index=B.findIndex(b=>b[0]===result.badgeName);\n if(index\u003c0||earned.has(B[index][0]))return;\n const b=B[index],tile=grid.querySelector('[data-b=\"'+index+'\"]');\n if(!tile)return;\n earned.add(b[0]);b[1]=1;persist();\n tile.classList.remove('lk');tile.querySelector('small').textContent='✓ Unlocked';\n tile.classList.add('badge-just-earned');\n setTimeout(()=>tile.classList.remove('badge-just-earned'),3000);\n $('bcount').textContent=earned.size+' / '+B.length+' earned';\n queue.push({index});showNext();\n});\n})();\n\nconst integratedGo=go;go=function(id){if(['fogalert','leaderboard','map','course'].includes(id)){window.dispatchEvent(new CustomEvent('aedesaway:navigate',{detail:id}));return;}if(id==='badges')window.dispatchEvent(new CustomEvent('aedesaway:show-badges'));integratedGo(id);};"},{"name":"fogging_alarm_tracker.html","styles":"\r\n:host{--g:#0f766e;--gd:#0b524d;--o:#f59e0b;--r:#dc2626;--b:#2563eb;--bg:#f2f6f5;--c:#fff;--t:#16302d;--m:#5c7370;--bd:#dbe6e4;color-scheme:light}\r\n*{box-sizing:border-box}.page-body{margin:0;background:var(--bg);color:var(--t);font:16px/1.5 system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif}\r\nheader{background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;padding:14px 16px}\r\n.w{max-width:980px;margin:auto}header .w{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}\r\nh1{mar ortant}\r\n.leaflet-tooltip{background:var(--aa-surface)!important;color:var(--aa-text)!important;border-color:var(--aa-border)!important}\r\ndialog::backdrop{background:#04110FC4}\r\n.tag,.avatar{background:var(--aa-soft)!important;color:var(--aa-text)!important;border-color:var(--aa-border)!important}\r\n.medal{background:#0F6F69!important;color:#FFFFFF!important;border-color:var(--aa-surface)!important}\r\ntd:first-child,th,.tag,.badge-preview-controls label,.badge-unlock-popup p{color:var(--aa-muted)!important}\r\n.badge-unlock-popup,.badge-preview-controls,.floating-reward,.bonus-reward{background:var(--aa-surface)!important;color:var(--aa-text)!important;border-color:var(--aa-border)!important}\r\n.badge-preview-controls button{background:#0F6F69!important;color:#FFFFFF!important}\r\n[style*=\"color:var(--brand)\"]{color:var(--aa-accent)!important}\r\n#why{background:var(--aa-surface)!important;color:var(--aa-text)!important}\r\n.strip button,.strip small{color:var(--aa-warntext)!important}\r\n.alert.o small{color:var(--aa-warntext)!important}\r\n.alert.r small{color:var(--aa-notext)!important}\r\n.alert.g small{color:var(--aa-oktext)!important}\r\n.stat-icon{background:var(--aa-soft)!important;color:var(--aa-accent)!important}\r\n","body":"\r\n\u003cheader>\u003cdiv class=\"w\">\u003ch1>🦟 FogAlert \u003cspan style=\"font-weight:400\">· Fogging Alarm &amp; Live Tracker\u003c/span>\u003c/h1>\u003cspan class=\"badge\">Prototype · sample data\u003c/span>\u003c/div>\u003c/header>\r\n\u003cdiv id=\"toasts\" aria-live=\"polite\">\u003c/div>\r\n\u003cmain>\r\n\u003csection id=\"setup\" class=\"card hero\">\u003cdiv class=\"e\">📍\u003c/div>\u003ch2 style=\"font-size:1.35rem\">Know before the fog arrives\u003c/h2>\r\n\u003cp>Enter your address to see fogging schedules for your area, track the fogging vehicle live and get precaution reminders.\u003c/p>\r\n\u003cform id=\"f\" novalidate>\u003clabel for=\"ad\">Home address\u003c/label>\u003ctextarea id=\"ad\" rows=\"2\" placeholder=\"e.g. 12, Jalan Mawar 3, Taman Bunga, Bukit Mertajam\">\u003c/textarea>\r\n\u003clabel for=\"zn\">Your area\u003c/label>\u003cselect id=\"zn\">\u003c/select>\u003cdiv class=\"err\" id=\"er\" role=\"alert\">\u003c/div>\r\n\u003cbutton class=\"btn w2\" type=\"submit\">Show my fogging schedule\u003c/button>\u003c/form>\r\n\u003cp class=\"sm\" style=\"margin-top:12px\">Prototype note: phone push notifications are not included. Alerts are simulated on this page.\u003c/p>\u003c/section>\r\n\r\n\u003cdiv id=\"dash\" class=\"hide\">\r\n\u003cdiv class=\"bar\">\u003cspan class=\"chip\" id=\"chip\">\u003c/span>\u003cbutton class=\"btn s sm\" id=\"chg\">Change address\u003c/button>\u003c/div>\r\n\u003cdiv id=\"ann\">\u003ch2 style=\"margin:4px 0\">📢 Fogging announcements for your address\u003c/h2>\u003cp class=\"sm\" id=\"cov\" style=\"margin:0 0 12px\">\u003c/p>\u003cdiv id=\"al0\" class=\"alert\" role=\"status\">\u003c/div>\u003cdiv id=\"alist\">\u003c/div>\r\n\u003cdetails>\u003csummary>🎛️ Demo controls (for judges)\u003c/summary>\u003cdiv class=\"ctl\">\r\n\u003cbutton class=\"btn sm\" id=\"d1\">📢 Authority posts schedule\u003c/button>\u003cbutton class=\"btn sm\" id=\"d2\">🌧️ Cancel / restore today\u003c/button>\u003cbutton class=\"btn sm s\" id=\"d3\">🔔 Enable phone-style alerts\u003c/button>\u003c/div>\r\n\u003cp class=\"sm\">These simulate the council posting or cancelling a schedule. The page then pushes an alert like a phone would.\u003c/p>\u003c/details>\u003c/div>\r\n\u003cdiv id=\"trk\" class=\"hide\">\u003cbutton class=\"btn s sm\" id=\"bk\" style=\"margin-bottom:12px\">← Back to announcements\u003c/button>\r\n\u003cdiv id=\"al\" class=\"alert\" role=\"status\">\u003c/div>\r\n\u003cdiv class=\"grid\">\u003cdiv>\r\n\u003csection class=\"card\">\u003ch2>🗺️ Live fogging vehicle\u003c/h2>\r\n\u003cdiv class=\"map\">\u003csvg id=\"svg\" viewBox=\"0 0 400 280\" role=\"img\" aria-label=\"Map showing fogging vehicle route and your home\">\u003c/svg>\u003cdiv id=\"ov\" class=\"ov hide\">\u003c/div>\u003c/div>\r\n\u003cdiv class=\"stats\">\u003cdiv>\u003cb id=\"s1\">–\u003c/b>\u003cspan>Away (ETA)\u003c/span>\u003c/div>\u003cdiv>\u003cb id=\"s2\">–\u003c/b>\u003cspan>Distance\u003c/span>\u003c/div>\u003c/div>\r\n\u003cdiv class=\"prog\">\u003ci id=\"pg\">\u003c/i>\u003c/div>\u003cdiv class=\"sm\" id=\"pt\" style=\"margin-top:4px\">\u003c/div>\r\n\u003cdiv class=\"ctl\">\u003cbutton class=\"btn\" id=\"go\">▶ Start live demo\u003c/button>\u003cbutton class=\"btn s\" id=\"rs\">↺ Reset\u003c/button>\r\n\u003c/div>\r\n\u003cp class=\"sm\">Demo: the vehicle's full run is simulated in about a minute. A real version would use the vehicle's GPS feed.\u003c/p>\u003c/section>\r\n\u003c/div>\r\n\u003cdiv>\r\n\u003csection class=\"card\">\u003ch2>📋 Fogging details\u003c/h2>\u003cdl class=\"info\" id=\"inf\">\u003c/dl>\u003c/section>\r\n\u003csection class=\"card\">\u003ch2>🛡️ Before fogging starts\u003c/h2>\u003cul class=\"pre\" id=\"pre\">\u003c/ul>\u003cdiv class=\"sm\" id=\"pc\" style=\"margin-top:8px\">\u003c/div>\u003c/section>\r\n\u003c/div>\u003c/div>\u003c/div>\u003c/div>\r\n\u003c/main>\r\n","js":"\r\nconst $=i=>document.getElementById(i);\r\nconst store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};\r\nconst ZONES=[\r\n{n:'Bukit Mertajam',k:['bukit mertajam','bm ','simpang ampat'],t:'5:00 PM – 6:30 PM',s:['Taman Bunga Raya','Jalan Mawar','Lorong Cempaka','Taman Sri Aman']},\r\n{n:'Seberang Jaya',k:['seberang jaya','permatang pauh'],t:'4:30 PM – 6:00 PM',s:['Taman Seri Jaya','Jalan Todak','Lorong Kenanga','Taman Impian']},\r\n{n:'Butterworth',k:['butterworth','perai'],t:'5:30 PM – 7:00 PM',s:['Taman Cahaya','Jalan Bagan','Lorong Melur','Taman Kasturi']},\r\n{n:'Bayan Lepas',k:['bayan lepas','bayan baru'],t:'5:00 PM – 6:30 PM',s:['Taman Bayan Indah','Jalan Tun Dr Awang','Lorong Delima','Taman Sri Nibong']},\r\n{n:'George Town',k:['george town','georgetown','jelutong'],t:'4:00 PM – 5:30 PM',s:['Lebuh Cecil','Jalan Perak','Lorong Hijau','Taman Free School']},\r\n{n:'Air Itam',k:['air itam','ayer itam'],t:'5:00 PM – 6:30 PM',s:['Taman Bukit Jambul','Jalan Paya Terubong','Lorong Mutiara','Taman Hijau'],cx:'Heavy rain forecast'}];\r\nconst day=o=>{const d=new Date();d.setDate(d.getDate()+o);return d.toLocaleDateString('en-MY',{weekday:'short',day:'numeric',month:'short'})};\r\nconst RUN=60,KM=10,ROUTE='M30,250 L30,130 L130,130 L130,50 L250,50 L250,130 L370,130 L370,210 L250,210 L250,250';\r\nlet Z,addr='',th=.5,p=0,run=false,last=0,cx=false,fl={},list=[],shown=[],cur=null,pts=[];\r\nconst hash=s=>[...s].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7);\r\nZONES.forEach((z,i)=>$('zn').add(new Option(z.n,i)));$('zn').insertBefore(new Option('Select your area…',''),$('zn').firstChild);$('zn').value='';\r\n$('ad').oninput=()=>{const a=' '+$('ad').value.toLowerCase()+' ',i=ZONES.findIndex(z=>z.k.some(k=>a.includes(k)));if(i>=0)$('zn').value=i};\r\n$('f').onsubmit=e=>{e.preventDefault();const a=$('ad').value.trim(),z=$('zn').value;\r\nif(a.length\u003c5)return $('er').textContent='Please enter your full address.';\r\nif(z==='')return $('er').textContent='Please choose your area.';\r\n$('er').textContent='';store.set('fa_addr',a);store.set('fa_zone',z);open(a,+z)};\r\n$('chg').onclick=()=>{run=false;cur=null;$('dash').classList.add('hide');$('setup').classList.remove('hide')};\r\nfunction open(a,zi){addr=a;Z=ZONES[zi];th=.3+(hash(a)%45)/100;fl={};p=0;run=false;cur=null;\r\nlist=[{d:'Today, '+day(0),t:Z.t,x:!!Z.cx,today:1},{d:day(4),t:Z.t},{d:day(11),t:Z.t}];\r\n$('setup').classList.add('hide');$('dash').classList.remove('hide');$('chip').textContent='📍 '+a+' · '+Z.n;$('ad').value=a;pre();back();window.scrollTo(0,0)}\r\nfunction back(){run=false;cur=null;$('trk').classList.add('hide');$('ann').classList.remove('hide');ann()}\r\nfunction ann(){const hit=Z.s.find(x=>addr.toLowerCase().includes(x.toLowerCase())),T=list[0];\r\n$('cov').textContent=hit?`✅ Your street (${hit}) is covered by the announcements below.`:`📍 Showing announcements for ${Z.n}, where your address is located.`;\r\n$('al0').className='alert '+(T.x?'r':'o');$('al0').innerHTML=T.x?'❌ Today\\'s fogging is cancelled\u003csmall>'+(Z.cx||'Heavy rain')+'. New date: '+day(2)+'. Tap the announcement for details.\u003c/small>':'📢 Fogging in your area today, '+Z.t+'\u003csmall>Tap the announcement below to track the vehicle live.\u003c/small>';\r\nshown=list.slice();if(T.x)shown.splice(1,0,{d:day(2),t:Z.t,r:1});\r\n$('alist').innerHTML=shown.map((i,k)=>{const bd=i.x?'\u003cspan class=\"st x\">CANCELLED\u003c/span>':i.today?'\u003cspan class=\"st live\">TODAY\u003c/span>':i.nw?'\u003cspan class=\"st\">NEW\u003c/span>':i.r?'\u003cspan class=\"st d\">RESCHEDULED\u003c/span>':'\u003cspan class=\"st\">UPCOMING\u003c/span>';\r\nreturn `\u003cbutton class=\"ai ${i.x?'cx':i.today?'t':''}\" data-k=\"${k}\">\u003cdiv class=\"ah\">\u003cb>${i.x?'\u003cs>'+i.d+'\u003c/s>':i.d}\u003c/b>${bd}\u003c/div>\u003cdiv class=\"sm\">${i.t} · ${Z.n}\u003c/div>\u003cdiv class=\"sm\">Covers: ${Z.s.join(', ')}\u003c/div>\u003cdiv class=\"go\">${i.x?'See cancellation details →':'Track fogging vehicle live →'}\u003c/div>\u003c/button>`}).join('');\r\n$('alist').querySelectorAll('.ai').forEach(b=>b.onclick=()=>trk(shown[+b.dataset.k]))}\r\nfunction trk(c){cur=c;cx=!!c.x;p=0;run=false;fl={};$('ann').classList.add('hide');$('trk').classList.remove('hide');buildMap();pre();sim();window.scrollTo(0,0)}\r\nfunction info(){$('inf').innerHTML=`\u003cdt>Status\u003c/dt>\u003cdd>${cx?'\u003cspan class=\"st x\">CANCELLED\u003c/span>':p>=1?'\u003cspan class=\"st d\">COMPLETED\u003c/span>':p>0?'\u003cspan class=\"st live\">IN PROGRESS\u003c/span>':'\u003cspan class=\"st\">SCHEDULED\u003c/span>'}\u003c/dd>\r\n\u003cdt>Date\u003c/dt>\u003cdd>${cx?'\u003cs>'+cur.d+'\u003c/s>':cur.d}\u003c/dd>\u003cdt>Time\u003c/dt>\u003cdd>${Z.t}\u003c/dd>\u003cdt>Area\u003c/dt>\u003cdd>${Z.n}\u003c/dd>\u003cdt>Covers\u003c/dt>\u003cdd>${Z.s.join(', ')}\u003c/dd>\r\n${cx?`\u003cdt>Reason\u003c/dt>\u003cdd style=\"color:var(--r)\">${Z.cx||'Heavy rain'}\u003c/dd>\u003cdt>New date\u003c/dt>\u003cdd>${day(2)}, ${Z.t}\u003c/dd>`:''}`}\r\nconst PRE=[['🍽️','Cover food and drinks','Keep food, cooking items and water containers covered or stored away.'],['🪟','Close windows and doors','Seal gaps and switch off fans pulling air from outside.'],['👵','Keep vulnerable people away','Move elderly, babies and asthma patients indoors, away from the fog path.'],['🐾','Bring pets and fish tanks in','Cover aquariums and keep pets inside while the fog passes.']];\r\nfunction pre(){const c=JSON.parse(store.get('fa_c')||'[]');$('pre').innerHTML=PRE.map((x,i)=>`\u003cli>\u003clabel class=\"${c.includes(i)?'on':''}\">\u003cinput type=\"checkbox\" data-i=\"${i}\" ${c.includes(i)?'checked':''}>\u003cdiv>\u003cb>${x[0]} ${x[1]}\u003c/b>\u003cspan>${x[2]}\u003c/span>\u003c/div>\u003c/label>\u003c/li>`).join('');\r\n$('pre').querySelectorAll('input').forEach(b=>b.onchange=()=>{const s=[...$('pre').querySelectorAll('input')].filter(e=>e.checked).map(e=>+e.dataset.i);store.set('fa_c',JSON.stringify(s));pre();sim()});\r\n$('pc').textContent=c.length+' of '+PRE.length+' precautions done'+(c.length==PRE.length?' ✅ you are ready!':'')}\r\nfunction buildMap(){let g='\u003crect width=\"400\" height=\"280\" fill=\"#eef3ee\"/>\u003crect x=\"140\" y=\"140\" width=\"100\" height=\"60\" rx=\"8\" fill=\"#cfe8d2\"/>\u003ctext x=\"190\" y=\"174\" text-anchor=\"middle\" font-size=\"10\" fill=\"#4b7a55\">Taman Awam\u003c/text>\u003cpath d=\"M0,95 Q100,70 180,100 T400,80 L400,100 Q300,120 180,120 T0,115Z\" fill=\"#cfe3f3\"/>';\r\n[30,130,250,370].forEach(x=>g+=`\u003cline x1=\"${x}\" y1=\"10\" x2=\"${x}\" y2=\"270\" stroke=\"#fff\" stroke-width=\"9\"/>`);[50,130,210,250].forEach(y=>g+=`\u003cline x1=\"10\" y1=\"${y}\" x2=\"390\" y2=\"${y}\" stroke=\"#fff\" stroke-width=\"9\"/>`);\r\ng+=`\u003cpath id=\"rt\" d=\"${ROUTE}\" fill=\"none\" stroke=\"#9db8b4\" stroke-width=\"5\" stroke-dasharray=\"2 7\" stroke-linecap=\"round\"/>\u003cpath id=\"tr\" d=\"${ROUTE}\" fill=\"none\" stroke=\"#0f766e\" stroke-width=\"5\" stroke-linecap=\"round\"/>\u003cg id=\"hm\">\u003c/g>\u003cg id=\"vh\">\u003ccircle id=\"fg\" r=\"22\" fill=\"#9aa5a3\" opacity=\".35\"/>\u003ccircle r=\"12\" fill=\"#f59e0b\" stroke=\"#fff\" stroke-width=\"2.5\"/>\u003ctext y=\"5\" text-anchor=\"middle\" font-size=\"13\">🚛\u003c/text>\u003c/g>`;\r\n$('svg').innerHTML=g;const r=$('rt');pts=[];const L=r.getTotalLength(),h=r.getPointAtLength(th*L);\r\n$('hm').innerHTML=`\u003ccircle cx=\"${h.x}\" cy=\"${h.y}\" r=\"30\" fill=\"#2563eb\" opacity=\".12\" stroke=\"#2563eb\" stroke-dasharray=\"4 3\"/>\u003ccircle cx=\"${h.x}\" cy=\"${h.y}\" r=\"9\" fill=\"#2563eb\" stroke=\"#fff\" stroke-width=\"2.5\"/>\u003ctext x=\"${h.x}\" y=\"${h.y-14}\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\">🏠 You\u003c/text>`}\r\nfunction toast(t,b){const e=document.createElement('div');e.className='toast';e.innerHTML=`\u003csmall>🦟 FogAlert · now\u003c/small>\u003cb>${t}\u003c/b>${b}`;$('toasts').append(e);setTimeout(()=>e.remove(),6000);\r\ntry{if(window.Notification&&Notification.permission==='granted')new Notification(t,{body:b})}catch(e){}}\r\nfunction once(k,t,b){if(!fl[k]){fl[k]=1;toast(t,b)}}\r\nfunction sim(){const r=$('rt');if(!r||!cur||$('trk').classList.contains('hide'))return;const L=r.getTotalLength(),v=r.getPointAtLength(p*L),v2=r.getPointAtLength(Math.min(L,p*L+1));\r\n$('vh').setAttribute('transform',`translate(${v.x},${v.y})`);$('tr').style.strokeDasharray=`${p*L} ${L}`;$('fg').setAttribute('r',22+(Math.sin(Date.now()/200)*2));\r\nconst eta=Math.max(0,(th-p)*RUN),dist=Math.max(0,(th-p)*KM),n=[...$('pre').querySelectorAll('input')].filter(e=>!e.checked).length,A=$('al');\r\n$('pg').style.width=p*100+'%';$('pt').textContent=cx?'Run cancelled':`Run progress ${Math.round(p*100)}% · ${KM} km route, about ${RUN} min`;\r\n$('ov').classList.toggle('hide',!cx);$('ov').innerHTML=cx?'🌧️ Today\\'s fogging is cancelled\u003cbr>\u003cspan style=\"font-weight:400;color:var(--m)\">'+(Z.cx||'Heavy rain')+'. New date: '+day(2)+'\u003c/span>':'';\r\nlet cls,h,s='';\r\nif(cx){cls='r';h='❌ Today\\'s fogging is cancelled';s='Rescheduled to '+day(2)+', '+Z.t+'.'}\r\nelse if(p>=1){cls='g';h='✅ Fogging run completed';s='If you closed up, wait about 30 minutes before opening windows and doors.'}\r\nelse if(p>0&&Math.abs(p-th)\u003c=.04){cls='r';h='🌫️ Fogging is at your address now';s='Stay indoors with windows closed. Keep vulnerable people away.';once('at','Fogging at your address','Stay indoors and keep windows closed.')}\r\nelse if(p>th){cls='g';h='✅ Fogging has passed your address';s='Wait about 30 minutes before opening windows and doors.'}\r\nelse if(p>0&&eta\u003c=15){cls='o';h=`⚠️ Vehicle is about ${Math.ceil(eta)} min away`;s=n?`Finish your precautions now (${n} left).`:'All precautions done. Stay indoors until it passes.';once('n','Fogging vehicle ~15 min away','Cover food, close windows, move vulnerable people indoors.')}\r\nelse if(p>0){cls='';h=`🚛 Fogging in progress in ${Z.n}`;s=`Vehicle is about ${Math.ceil(eta)} min from your address.`}\r\nelse{cls='';h=`📅 Fogging scheduled: ${cur.d}, ${Z.t}`;s='The vehicle has not started yet. Press Start live demo to simulate the run.'}\r\nA.className='alert '+cls;A.innerHTML=h+'\u003csmall>'+s+'\u003c/small>';\r\n$('s1').textContent=cx||p>=th?'–':Math.ceil(eta)+' min';$('s2').textContent=cx||p>=th?'–':dist.toFixed(1)+' km';\r\n$('go').textContent=run?'⏸ Pause':(p>0&&p\u003c1?'▶ Resume':'▶ Start live demo');info()}\r\nfunction tick(t){if(run){const dt=Math.min(100,t-last)/1000;p=Math.min(1,p+dt/60);if(p>=1)run=false;sim()}last=t;requestAnimationFrame(tick)}\r\n$('rs').title='Restart';$('bk').onclick=back;\r\n$('go').onclick=()=>{if(cx)return toast('Cancelled','No vehicle is running today.');if(p>=1)p=0,fl={};run=!run;sim()};\r\n$('rs').onclick=  .badge-art::before {\n  inset: 0 0 5.5%;\n  z-index: -2;\n  background: var(--color);\n}\n:is(#badges, #badgeDetail) .badge-art::after {\n  inset: 13.5% 15% 19%;\n  z-index: -1;\n  background: linear-gradient(#ffffff70, #ffffff70), var(--color);\n}\n#badgeDetail .badge-art {\n  width: 114px;\n  height: auto;\n  font-size: 44px;\n}\n@media (max-width: 360px) {\n  #badges .badge-art { width: 76px; font-size: 29px; }\n}\n\n/* Active checklist interactions only; persisted progress never plays rewards. */\r\n.task{position:relative;border-radius:10px;transition:background-color .4s,box-shadow .4s}\r\n.task input{position:relative;transition:border-radius .35s,background-color .35s,border-color .35s,transform .35s}\r\n.task input:checked{border-radius:50%}\r\n.task label,.task p{transition:color .4s}\r\n.task .status{display:block;min-height:0;transition:color .4s}\r\n.task.done{background-color:#f4faf4}\r\n.task-pop{animation:task-glow .75s ease-out}\r\n.task-pop input{animation:check-bounce .5s ease-out}\r\n.task-pop input:before{content:'';position:absolute;inset:-6px;border:2px solid #6dbd96;border-radius:50%;pointer-events:none;animation:check-ripple .65s ease-out both}\r\n.floating-reward,.task-sparkles,.bonus-reward{position:absolute;pointer-events:none;z-index:2;font-weight:700;white-space:nowrap}\r\n.floating-reward{left:27px;top:0;color:var(--teal);font-size:12px;background:#effbf3;border-radius:20px;padding:5px 10px;animation:reward-rise .8s ease-out both}\r\n.task-sparkles{left:4px;top:10px;color:#d8b34c;font-size:23px;letter-spacing:10px;animation:sparkle-out .7s ease-out both}\r\n#checklist{position:relative}\r\n.mission-celebration{animation:mission-glow 1.8s ease-out}\r\n.bonus-reward{top:95px;right:20px;background:#fff2c7;color:#8d7029;padding:9px 14px;border-radius:20px;font-size:13px;animation:bonus-rise 1.6s ease-out both}\r\n#points,#percent{font-variant-numeric:tabular-nums}\r\n.confetti{animation-duration:1.55s}\r\n@keyframes check-bounce{0%{transform:scale(.85)}45%{transform:scale(1.27)}75%{transform:scale(.95)}100%{transform:scale(1)}}\r\n@keyframes check-ripple{from{transform:scale(.6);opacity:.7}to{transform:scale(1.9);opacity:0}}\r\n@keyframes task-glow{0%,100%{box-shadow:0 0 0 0 transparent}35%{box-shadow:0 0 18px 3px #9bdbb951;background:#e6f8ec}}\r\n@keyframes reward-rise{0%{opacity:0;transform:translateY(8px)}20%{opacity:1}100%{opacity:0;transform:translateY(-38px)}}\r\n@keyframes sparkle-out{0%{opacity:0;transform:scale(.6)}30%{opacity:1}100%{opacity:0;transform:translateY(-22px) scale(1.3)}}\r\n@keyframes mission-glow{0%,100%{box-shadow:0 4px 18px #264c3003}35%{box-shadow:0 0 30px #70bd8c55;border-color:#8ecda4}}\r\n@keyframes bonus-rise{0%{opacity:0;transform:translateY(15px) scale(.9)}20%,65%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-28px)}}\r\n@media(prefers-reduced-motion:reduce){.task,.task input,.task label,.task p{transition:none}.floating-reward,.task-sparkles,.bonus-reward{display:none}}\r\n/* First-time badge notification: independent of weekly/task confetti. */\r\n.badge-unlock-popup{position:fixed;top:max(22px,env(safe-area-inset-top));left:50%;z-index:40;display:flex;align-items:center;gap:16px;width:max-content;max-width:calc(100vw - 32px);padding:18px 24px;border:1px solid #edce7d;border-radius:20px;background:linear-gradient(120deg,#fffdf3,#fff5d6);box-shadow:0 8px 35px #d6aa3b45,0 0 20px #f3d57755;transform:translateX(-50%);pointer-events:none;animation:badge-popup-bounce .65s cubic-bezier(.22,1,.36,1),badge-golden-glow 1.4s ease-in-out .65s}\r\n.badge-unlock-icon{display:grid;place-items:center;flex-shrink:0;width:61px;height:68px;background:var(--color);clip-path:polygon(50% 0,94% 24%,94% 74%,50% 100%,6% 74%,6% 24%);font-size:32px;filter:drop-shadow(0 0 7px #e4b339)}\r\n.badge-unlock-popup p{margin:0 0 6px;font-size:11px;font-weight:700;letter-spacing:.6px;color:#947227}\r\n.badge-unlock-popup strong{font-size:19px;line-height:1.35;color:var(--ink);overflow-wrap:anywhere}\r\n.badge-unlock-confetti{position:absolute;left:50%;top:40%;pointer-events:none}\r\n.badge-unlock-confetti i{position:absolute;width:6px;height:10px;border-radius:2px;opacity:0;animation:badge-confetti-burst 1.2s ease-out both}\r\n@keyframes badge-popup-bounce{0%{opacity:0;transform:translate(-50%,-24px) scale(.7)}55%{opacity:1;transform:translate(-50%,4px) scale(1.06)}78%{transform:translate(-50%,-2px) scale(.98)}100%{transform:translate(-50%,0) scale(1)}}\r\n@keyframes badge-golden-glow{50%{box-shadow:0 10px 40px #d6aa3b60,0 0 30px #f3d57780}}\r\n@keyframes badge-confetti-burst{0%{opacity:0;transform:translate(0,0) rotate(0)}15%{opacity:1}100%{opacity:0;transform:translate(var(--x),95px) rotate(var(--turn))}}\r\n@media(max-width:480px){.badge-unlock-popup{padding:14px 17px;gap:12px}.badge-unlock-popup strong{font-size:16px}.badge-unlock-popup p{font-size:10px}.badge-unlock-icon{width:49px;height:55px;font-size:27px}}\r\n@media(prefers-reduced-motion:reduce){.badge-unlock-popup,.badge-unlock-confetti i{animation:none!important}}\r\n\r\n\r\n/* Seven activity-specific cartoon vignettes. No layout shift or click blocking. */\r\n.task-scene{position:absolute;right:3px;top:50%;width:160px;height:90px;z-index:3;pointer-events:none;filter:drop-shadow(0 4px 9px #37664720);animation:scene-visit 1.85s ease both}\r\n.task-scene svg{display:block;width:100%;height:100%;overflow:visible}\r\n.task-scene svg g{transform-box:fill-box;transform-origin:center}\r\n.scene-tip{animation:scene-tip 1.7s ease-in-out both;transform-origin:77px 65px!important}\r\n.scene-drops{animation:scene-drops 1.7s ease both}\r\n.scene-grow{animation:scene-grow 1.7s ease both;transform-origin:bottom!important}\r\n.scene-debris{animation:scene-clear 1.7s ease both}\r\n.scene-flow{animation:scene-flow 1.7s ease both}\r\n.scene-lid{animation:scene-lid 1.7s cubic-bezier(.34,1.56,.64,1) both}\r\n.scene-seal{animation:scene-twinkle 1.7s ease both;transform-origin:center}\r\n.scene-bottle{animation:scene-bottle 1.7s ease both}\r\n.scene-can{animation:scene-can 1.7s ease both}\r\n.scene-broom{animation:scene-sweep 1.7s ease both;transform-origin:top!important}\r\n.scene-puddle{animation:scene-dry 1.7s ease both;transform-origin:center}\r\n.scene-dust{animation:scene-clear 1.7s ease both}\r\n.scene-gutter-leaf{animation:scene-leaf 1.7s ease both}\r\n.scene-gutter-water{animation:scene-drops 1.7s ease both}\r\n.scene-fresh-water{animation:scene-fill 1.7s ease both;transform-origin:bottom;transform-box:fill-box}\r\n.scene-flower{animation:scene-grow 1.7s ease both;transform-origin:bottom!important}\r\n.scene-scrub{animation:scene-scrub 1.7s ease both}\r\n.scene-twinkles{animation:scene-twinkle 1.7s ease both}\r\n@keyframes scene-visit{0%{opacity:0;transform:translateY(-45%) scale(.8)}12%,85%{opacity:1;transform:translateY(-50%) scale(1)}100%{opacity:0;transform:translateY(-56%) scale(.96)}}\r\n@keyframes scene-tip{0%,15%,90%,100%{transform:rotate(0)}40%,65%{transform:rotate(22deg)}}\r\n@keyframes scene-drops{0%,25%{opacity:0;transform:translateY(-10px)}40%{opacity:1;transform:translateY(0)}70%{opacity:0;transform:translateY(18px)}80%{opacity:1;transform:translateY(-4px)}100%{opacity:0;transform:translateY(12px)}}\r\n@keyframes scene-grow{0%,20%{transform:scale(.8)}65%{transform:scale(1.08)}100%{transform:scale(1)}}\r\n@keyframes scene-clear{0%,15%{transform:translateX(0);opacity:1}70%,100%{transform:translate(35px,-20px) rotate(30deg);opacity:0}}\r\n@keyframes scene-flow{0%,20%{opacity:.2;transform:translateX(-8px)}70%,100%{opacity:1;transform:translateX(8px)}}\r\n@keyframes scene-lid{0%,15%{transform:translate(-8px,-18px) rotate(-15deg)}60%,100%{transform:translate(0,0) rotate(0)}}\r\n@keyframes scene-twinkle{0%,30%{opacity:0;transform:scale(.4)}60%{opacity:1;transform:scale(1.2)}85%,100%{opacity:1;transform:scale(1)}}\r\n@keyframes scene-bottle{0%,15%{transform:translate(0,0)}45%{transform:translate(40px,-30px) rotate(25deg)}80%,100%{transform:translate(56px,20px) scale(.2);opacity:0}}\r\n@keyframes scene-can{0%,30%{transform:translate(0,0)}60%{transform:translate(-22px,-24px) rotate(-30deg)}90%,100%{transform:translate(-43px,15px) scale(.2);opacity:0}}\r\n@keyframes scene-sweep{0%{transform:rotate(-15deg) translateX(-10px)}30%{transform:rotate(15deg) translateX(12px)}60%{transform:rotate(-12deg)}90%,100%{transform:rotate(12deg) translateX(13px)}}\r\n@keyframes scene-dry{0%,20%{transform:scaleX(1);opacity:1}85%,100%{transform:scaleX(.1);opacity:0}}\r\n@keyframes scene-leaf{0%,15%{transform:translateX(0)}55%{transform:translateX(50px) rotate(25deg);opacity:1}90%,100%{transform:translate(65px,40px) rotate(90deg);opacity:0}}\r\n@keyframes scene-fill{0%,15%{transform:scaleY(.1);opacity:.3}85%,100%{transform:scaleY(1);opacity:1}}\r\n@keyframes scene-scrub{0%,100%{transform:translateY(0)}25%,65%{transform:translate(-12px,-12px)}45%,85%{transform:translate(0,5px)}}\r\n@media(max-width:480px){.task-scene{width:132px;height:75px;right:0}}\r\n@media(prefers-reduced-motion:reduce){.task-scene{display:none}.task-scene *{animation:none!important}}\r\n/* Compact temporary demo controls; all effects are confined to the preview stage. */\n.animation-preview{position:relative;margin-top:20px;padding:13px;border:1px dashed #dfcc91;border-radius:10px;background:#fffcf0;color:var(--ink);font-size:11px}\n.animation-preview summary{cursor:pointer;font-weight:600;color:var(--teal)}\n.animation-preview p{font-size:10px;line-height:1.6;color:var(--muted)}\n.animation-preview label{display:block;margin:12px 0 6px;font-weight:600}\n.animation-preview>div:not(.preview-stage){display:flex;gap:8px;flex-wrap:wrap}\n.animation-preview select{flex:1;min-width:0;width:100%;padding:8px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);font:inherit}\n.animation-preview button{padding:9px 12px;border:0;border-radius:7px;background:var(--teal);color:white;font:inherit}\n.preview-stage{margin-top:14px;border-radius:8px;padding:8px;background:#f4faf4}\n.preview-stage .task{min-height:100px;pointer-events:none}\n.preview-stage .task input:disabled{opacity:1}\n.preview-stage .preview-task-name{max-width:45%;font-size:10px}\n.preview-stage .track div{width:0}\n.preview-stage>small{display:block;margin-top:8px;color:var(--teal)}\n:is(#badges,#badgeDetail,.badge-unlock-popup) .badge-art{--badge-hexagon:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);position:relative;isolation:isolate;display:grid;place-items:center;max-width:100%;height:auto;aspect-ratio:114/139;padding-bottom:6px;background:linear-gradient(#0003,#0003),var(--color);clip-path:var(--badge-hexagon);line-height:1}\n:is(#badges,#badgeDetail,.badge-unlock-popup) .badge-art::before,:is(#badges,#badgeDetail,.badge-unlock-popup) .badge-art::after{content:'';position:absolute;pointer-events:none;clip-path:var(--badge-hexagon)}\n:is(#badges,#badgeDetail,.badge-unlock-popup) .badge-art::before{inset:0 0 5.5%;z-index:-2;background:var(--color)}\n:is(#badges,#badgeDetail,.badge-unlock-popup) .badge-art::after{inset:13.5% 15% 19%;z-index:-1;background:linear-gradient(#ffffff70,#ffffff70),var(--color)}\n.badge-unlock-popup .badge-art{width:61px;margin:0;font-size:32px;flex-shrink:0;filter:none}\n@media(max-width:480px){.badge-unlock-popup .badge-art{width:49px;font-size:27px}.task-scene{width:120px;height:68px}}\n@media(prefers-reduced-motion:reduce){.task-pop,.mission-celebration{animation:none}.animation-preview .task-scene{display:none}}/* Keep the reference's light animation surfaces readable under a dark host theme. */\n.animation-preview{--ink:#20463d;--muted:#65795f;--teal:#187b69;--line:#dce5d5}\n.badge-unlock-popup strong{color:#20463d}\n/* Keep the real checked checkbox visible above shared form theme colours. */\n.task input[type=\"checkbox\"]:checked{background:var(--shared-button,#0f6f69)!important;border-color:var(--shared-button,#0f6f69)!important;color:#fff!important}\n.task input[type=\"checkbox\"]:checked::after{content:'✓';display:block;color:#fff!important;line-height:1;font-weight:700;opacity:1}\n.task input[type=\"checkbox\"]:not(:checked)::after{content:none}\n","body":"\u003cmain>\u003csection class=\"welcome\">\u003cdiv>\u003cp class=\"eyebrow\">A LITTLE CARE. A HEALTHIER MALAYSIA.\u003c/p>\u003ch1>Small Actions,\u003cbr>\u003cem>Stronger Communities.\u003c/em>\u003c/h1>\u003cp>Seven simple habits. One shared goal. Let's keep our\u003cbr> neighbourhoods free from mosquito breeding sites.\u003c/p>\u003c/div>\u003cdiv class=\"illustration\" aria-hidden=\"true\">\u003cspan>☀\u003c/span>\u003cdiv>🌳 🏡 🏘️ 🌿\u003c/div>\u003csmall>♡ Better together\u003c/small>\u003c/div>\u003c/section>\u003csection class=\"stats\">\u003carticle>\u003cspan class=\"stat-icon\">✦\u003c/span>\u003cdiv>\u003cp>Your total points\u003c/p>\u003cstrong id=\"points\">0\u003c/strong>\u003csmall>Every action makes a difference\u003c/small>\u003c/div>\u003c/article>\u003carticle>\u003cspan class=\"stat-icon mint\">✓\u003c/span>\u003cdiv>\u003cp>This week's progress\u003c/p>\u003cstrong id=\"summary\">0 / 7\u003c/strong>\u003csmall>Small steps, real community care\u003c/small>\u003c/div>\u003c/article>\u003carticle>\u003cspan class=\"stat-icon peach\">🔥\u003c/span>\u003cdiv>\u003cp>Weekly streak\u003c/p>\u003cstrong id=\"streak\">0 weeks\u003c/strong>\u003csmall id=\"best\">Personal best: 0 weeks\u003c/small>\u003c/div>\u003c/article>\u003c/section>\u003csection class=\"panel community\" id=\"community\">\u003cdiv class=\"heading\">\u003cdiv>\u003cp class=\"eyebrow\">A FRIENDLY LITTLE COMPETITION\u003c/p>\u003ch2>Good neighbours. Great impact.\u003c/h2>\u003cp>Meet the people making prevention a weekly habit.\u003c/p>\u003c/div>\u003cspan class=\"chip\">● Fictional demo leaderboard\u003c/span>\u003c/div>\u003cdiv class=\"toolbar\">\u003cdiv class=\"tabs\" role=\"group\" aria-label=\"Leaderboard type\">\u003cbutton id=\"individual\" aria-pressed=\"true\">♙ Individuals\u003c/button>\u003cbutton id=\"neighbourhood\" aria-pressed=\"false\">⌂ Neighbourhoods\u003c/button>\u003c/div>\u003csmall>✦ All-time prevention points\u003c/small>\u003c/div>\u003cdiv class=\"podium\" id=\"podium\">\u003c/div>\u003cdiv class=\"table-wrap\">\u003ctable>\u003ccaption class=\"sr-only\">Prevention points leaderboard\u003c/caption>\u003cthead>\u003ctr>\u003cth>RANK\u003c/th>\u003cth id=\"nameHeading\">NEIGHBOUR\u003c/th>\u003cth>ACHIEVEMENT\u003c/th>\u003cth>STREAK\u003c/th>\u003cth>POINTS\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"rows\">\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"leader-footer\">\u003cspan id=\"rank\">\u003c/span>\u003ca href=\"#checklist\">Earn your next 10 points ↗\u003c/a>\u003c/div>\u003c/section>\u003cdiv class=\"columns\">\u003csection class=\"panel\" id=\"checklist\">\u003cdiv class=\"heading\">\u003cdiv>\u003cp class=\"eyebrow\">YOUR WEEKLY RITUAL\u003c/p>\u003ch2>A little care goes a long way\u003c/h2>\u003c/div>\u003cspan class=\"chip\" id=\"week\">\u003c/span>\u003c/div>\u003cp class=\"copy\">Spend a few minutes checking these common breeding spots.\u003c/p>\u003cdiv class=\"progress-label\">\u003cb id=\"progressText\">\u003c/b>\u003cspan id=\"percent\">\u003c/span>\u003c/div>\u003cdiv class=\"track\">\u003cdiv id=\"fill\">\u003c/div>\u003c/div>\u003cp id=\"message\" class=\"copy\" aria-live=\"polite\">\u003c/p>\u003cdiv id=\"tasks\">\u003c/div>\u003c/section>\u003caside>\u003csection class=\"panel\" id=\"achievements\">\u003cdiv class=\"heading\">\u003cdiv>\u003cp class=\"eyebrow\">LITTLE WINS, BIG PRIDE\u003c/p>\u003ch2>Your badge collection\u003c/h2>\u003c/div>\u003cspan class=\"chip\" id=\"badgeCount\">\u003c/span>\u003c/div>\u003cp class=\"copy\">Good habits deserve a little recognition.\u003c/p>\u003cdiv id=\"badges\" class=\"badges\">\u003c/div>\u003cp class=\"hint\">Tap a badge to discover its story.\u003c/p>\u003c/section>\u003csection class=\"habit\">\u003cspan>🔥\u003c/span>\u003cdiv>\u003ch3>Make it a weekly thing.\u003c/h3>\u003cp id=\"encouragement\">\u003c/p>\u003csmall>Finish all 7 tasks each week to build your streak. No daily check-ins needed.\u003c/small>\u003cp class=\"reward\">2 consecutive weeks: +20 pts.\u003cbr>4 weeks and every 4-week milestone: +40 pts.\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"together\">\u003cspan>🌱\u003c/span>\u003ch3>A safer street starts with us.\u003c/h3>\u003cp>Your flowerpot. Their backyard. Our community. Invite a neighbour to join your weekly prevention routine.\u003c/p>\u003csmall>MADE FOR MALAYSIAN COMMUNITIES ♡\u003c/small>\u003c/section>\u003c/aside>\u003c/div>\u003cfooter>\u003cb>Aedes Together\u003c/b>\u003cspan>Small actions today. A healthier neighbourhood tomorrow.\u003c/span>\u003csmall>Hackathon prototype · Stored on this device\u003c/small>\u003c/footer>\u003c/main>\u003cdialog id=\"badgeModal\">\u003cbutton class=\"close\" aria-label=\"Close\">×\u003c/button>\u003cdiv id=\"badgeDetail\">\u003c/div>\u003c/dialog>\u003cdiv id=\"toast\" role=\"status\">\u003c/div>\u003cdiv id=\"confetti\" aria-hidden=\"true\">\u003c/div>","js":"/* Aedes Together: local-only weekly activity ledger. */\r\n(() => {\r\n'use strict';\r\n// Retain the legacy storage key so existing residents keep their progress.\r\nconst KEY='jiran-challenge-v1', $=id=>document.getElementById(id);\r\nconst tasks=[['🪴','Empty flowerpots & saucers','Empty stagnant water from flowerpots and saucers. Small pools can become breeding sites.'],['💧','Check & clear clogged drains','Remove leaves and debris so water flows freely through drains.'],['🪣','Cover water storage containers','Keep containers tightly covered to prevent mosquitoes laying eggs.'],['♻️','Dispose of unused containers','Dispose of unused bottles, cans and plastic containers that collect rainwater.'],['🌿','Freshen up outdoor spaces','Clean outdoor areas and remove standing water from hidden corners.'],['🏡','Check gutters & roof drainage','Check only where safely accessible. Never climb or risk a fall.'],['🌷','Refresh your flower vases','Replace water and scrub containers to remove mosquito eggs.']];\r\nconst badges=[{id:'first',name:'First Step',icon:'🌱',color:'#bcdc9c',description:'A healthier neighbourhood starts with one small action.',requirement:'Complete your first prevention task.'},{id:'sweep',name:'Clean Sweep',icon:'✨',color:'#f1d482',description:'Seven small actions. A whole week of care.',requirement:'Complete all seven tasks in a week.'},{id:'star',name:'Consistency Star',icon:'⭐',color:'#c7bee9',description:'Your weekly habit is starting to shine.',requirement:'Complete two consecutive weeks.'},{id:'defender',name:'Dengue Defender',icon:'🛡️',color:'#a4d9d3',description:'A month of showing up for a safer neighbourhood.',requirement:'Complete four consecutive weeks.'},{id:'hero',name:'Community Hero',icon:'🏅',color:'#e9bd95',description:'Your care for your community really adds up.',requirement:'Reach 500 total points.'},{id:'champion',name:'Prevention Champion',icon:'👑',color:'#eace77',description:'An extraordinary milestone built on simple habits.',requirement:'Reach 1,000 total points.'}];\r\nconst samples=[['Aisyah Rahman','Taman Melati',1280,12],['Daniel Tan','Taman Desa',1140,10],['Priya Kumar','Taman Bukit Indah',980,9],['Amir Hakim','Taman Melati',860,8],['Mei Ling','Taman Desa',750,7],['Siti Nurhaliza','Taman Setia',620,6],['Ravi Chandran','Taman Bukit Indah',490,5],['Nur Farah','Taman Setia',340,4],['Jason Lim','Taman Melati',210,3],['Hana Abdullah','Taman Desa',90,1]];\r\n// Monday-based local calendar dates; UTC arithmetic avoids DST week-length errors.\r\nfunction weekKey(date=new Date()){const d=new Date(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate()));d.setUTCDate(d.getUTCDate()-(d.getUTCDay()+6)%7);return d.toISOString().slice(0,10);}\r\nfunction previous(key){const d=new Date(key+'T00:00:00Z');d.setUTCDate(d.getUTCDate()-7);return d.toISOString().slice(0,10);}\r\nconst fresh=()=>({version:1,weeks:{},badges:[]});let state;\r\ntry{state=JSON.parse(localStorage.getItem(KEY));if(!state||state.version!==1||!state.weeks||typeof state.weeks!=='object'||Array.isArray(state.weeks)||!Array.isArray(state.badges))state=fresh();}catch{state=fresh();}\r\nfor(const [key,w] of Object.entries(state.weeks)){if(!/^\\d{4}-\\d{2}-\\d{2}$/.test(key)||!w||!Array.isArray(w.tasks)){delete state.weeks[key];continue;}w.tasks=Array.from({length:7},(_,i)=>['completed','approved'].includes(w.tasks[i])?'completed':'todo');}\r\nstate.badges=state.badges.filter(id=>badges.some(b=>b.id===id));\r\nlet current='',mode='individual',timer,warned=false;\r\nfunction ensureWeek(){current=weekKey();if(!state.weeks[current])state.weeks[current]={tasks:Array(7).fill('todo')};}\r\nfunction save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch{if(!warned){toast('Storage unavailable: progress lasts only for this session.');warned=true;}}}\r\nfunction complete(w){return w.tasks.every(s=>s==='completed');}\r\n// Recompute rewards from the ledger, so undo/recheck never duplicates points.\r\nfunction metrics(){let points=0,run=0,best=0,last=null,total=0,weeks=0;const runs={};Object.keys(state.weeks).sort().filter(k=>k\u003c=current).forEach(k=>{const w=state.weeks[k],count=w.tasks.filter(s=>s==='completed').length;total+=count;points+=count*10;if(complete(w)){run=last===previous(k)?run+1:1;last=k;runs[k]=run;best=Math.max(best,run);weeks++;points+=30+(run===2?20:run%4===0?40:0);}else{run=0;last=null;}});return{points,best,streak:runs[current]||runs[previous(current)]||0,total,weeks,count:state.weeks[current].tasks.filter(s=>s==='completed').length};}\r\nfunction unlock(m){const conditions=[m.total>0,m.weeks>0,m.best>=2,m.best>=4,m.points>=500,m.points>=1000],earned=[];badges.forEach((b,i)=>{if(conditions[i]&&!state.badges.includes(b.id)){state.badges.push(b.id);earned.push(b.id);}});return earned;}\r\nfunction toast(text){clearTimeout(timer);$('toast').textContent=text;$('toast').classList.add('show');timer=setTimeout(()=>$('toast').classList.remove('show'),5000);}\r\nfunction celebrate(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;for(let i=0;i\u003c30;i++){const c=document.createElement('i');c.className='confetti';c.style.left=Math.random()*100+'%';c.style.background=['#70ad8d','#f3d071','#b8d9b2','#dfb498'][i%4];c.style.animationDelay=Math.random()*.4+'s';$('confetti').append(c);setTimeout(()=>c.remove(),2400);}}\r\nfunction renderTasks(){\r\nif ($('tasks').children.length === tasks.length) {\r\n  tasks.forEach((_, i) => {\r\n    const input = $('task-' + i), done = state.weeks[current].tasks[i] === 'completed';\r\n    input.checked = done;\r\n    input.closest('.task').classList.toggle('done', done);\r\n    input.closest('.task').querySelector('.status').textContent = done ? '✓ Completed · uncheck to undo' : '';\r\n  });\r\n  return;\r\n}$('tasks').innerHTML=tasks.map(([icon,title,description],i)=>{const s=state.weeks[current].tasks[i];return `\u003cdiv class=\"task ${s==='completed'?'done':''}\">\u003cinput type=\"checkbox\" id=\"task-${i}\" data-task=\"${i}\" ${s==='completed'?'checked':''} aria-describedby=\"desc-${i}\">\u003cspan class=\"task-icon\" aria-hidden=\"true\">${icon}\u003c/span>\u003cdiv class=\"task-copy\">\u003clabel for=\"task-${i}\">${title}\u003c/label>\u003cp id=\"desc-${i}\">${description}\u003c/p>\u003cspan class=\"status\">${s==='completed'?'✓ Completed · uncheck to undo':''}\u003c/span>\u003c/div>\u003cspan class=\"task-points\">+10 pts\u003c/span>\u003c/div>`;}).join('');}\r\nfunction renderBadges(earned=[]){$('badgeCount').textContent=`${state.badges.length} / 6`;$('badges').innerHTML=badges.map(b=>{const yes=state.badges.includes(b.id);return `\u003cbutton class=\"badge ${yes?'':'locked'} ${earned.includes(b.id)?'earned':''}\" data-badge=\"${b.id}\" aria-label=\"${b.name}, ${yes?'unlocked':'locked'}: view requirements\">\u003cspan class=\"badge-art${b.id==='first'?' badge-art--first':''}\" style=\"--color:${b.color}\">${b.icon}\u003c/span>\u003cb>${b.name}\u003c/b>\u003csmall>${yes?'✓ Unlocked':'♧ Locked'}\u003c/small>\u003c/button>`;}).join('');}\r\nfunction renderLeaderboard(m){let entries;if(mode==='individual'){entries=samples.map(([name,area,points,streak])=>({name,area,points,streak}));entries.push({name:'You',area:'Your local community',points:m.points,streak:m.streak,you:true});}else entries=['Taman Melati','Taman Desa','Taman Bukit Indah','Taman Setia','Taman Harmoni','Taman Mutiara','Taman Ria','Taman Damai','Taman Aman','Taman Indah'].map((name,i)=>({name,area:`${42-i*3} demo neighbours`,points:[5360,4820,4170,3280,2840,2310,1970,1620,1280,940][i],streak:Math.max(1,12-i)}));entries.sort((a,b)=>b.points-a.points);entries.forEach((e,i)=>e.rank=i+1);const avatar=e=>`\u003cspan class=\"avatar\" style=\"background:${['#e9dcb8','#d6e7d9','#eed5be','#dbe6ee','#e6dcef'][(e.rank-1)%5]}\">${e.you?'Y':e.name.split(' ').slice(0,2).map(s=>s[0]).join('')}\u003c/span>`;\r\n$('podium').innerHTML=[1,0,2].map(i=>{const e=entries[i];return `\u003carticle class=\"podium-card ${i===0?'gold':i===2?'bronze':'silver'}\">${i===0?'\u003cspan class=\"crown\" aria-hidden=\"true\">♛\u003c/span>':''}\u003cdiv class=\"podium-avatar\">${avatar(e)}\u003cspan class=\"medal\">${e.rank}\u003c/span>\u003c/div>\u003ch3>${e.name}${e.you?' (you)':''}\u003c/h3>\u003cp>${e.area}\u003c/p>\u003cdiv class=\"podium-points\">${e.points.toLocaleString()} \u003csmall>pts\u003c/small>\u003c/div>\u003csmall>🔥 ${e.streak}-week ${mode==='individual'?'streak':'team best'}\u003c/small>\u003c/article>`;}).join('');\r\nconst you=entries.find(e=>e.you),shown=entries.slice(0,10);if(you&&you.rank>10)shown.push(you);\r\nfunction achievement(e){if(mode!=='individual')return '🌿 Community care';if(e.you){const b=[...badges].reverse().find(b=>state.badges.includes(b.id));return b?b.icon+' '+b.name:'New neighbour';}return e.points>=1000?'👑 Champion':e.points>=500?'🏅 Hero':e.streak>=4?'🛡 Defender':e.streak>=2?'⭐ Consistency':'✨ Clean Sweep';}\r\n$('rows').innerHTML=shown.map(e=>`\u003ctr class=\"${e.you?'you':''}\">\u003ctd>${e.rank\u003c=3?['🥇','🥈','🥉'][e.rank-1]:String(e.rank).padStart(2,'0')}\u003c/td>\u003ctd>\u003cdiv class=\"resident\">${avatar(e)}\u003cdiv>${e.name}${e.you?'\u003cspan class=\"you-label\">YOU\u003c/span>':''}\u003csmall>${e.area}\u003c/small>\u003c/div>\u003c/div>\u003c/td>\u003ctd>\u003cspan class=\"tag\">${achievement(e)}\u003c/span>\u003c/td>\u003ctd class=\"streak-cell\">🔥 ${e.streak} weeks\u003c/td>\u003ctd>${e.points.toLocaleString()}\u003c/td>\u003c/tr>`).join('');$('nameHeading').textContent=mode==='individual'?'NEIGHBOUR':'NEIGHBOURHOOD';$('rank').textContent=you?`You're #${you.rank} of ${entries.length}. Top 10 + your position. Ties follow demo residents.`:'Fictional aggregate points · streak = best member · your points are not assigned to a team.';}\r\nfunction render(earned=[]){counterFrames.forEach(frame => cancelAnimationFrame(frame));counterFrames.clear();ensureWeek();const m=metrics(),percent=Math.round(m.count/7*100);$('points').textContent=m.points.toLocaleString();$('summary').textContent=`${m.count} / 7 tasks`;$('streak').textContent=`${m.streak} ${m.streak===1?'week':'weeks'}`;$('best').textContent=`Personal best: ${m.best} weeks`;$('progressText').textContent=`${m.count} of 7 completed`;$('percent').textContent=percent+'%';$('fill').style.width=percent+'%';$('message').textContent=m.count===7?'Beautiful work! All tasks completed. +30 weekly bonus earned.':m.count===0?'A fresh week, a fresh chance to make a difference.':`${7-m.count} more small actions to your +30 point weekly bonus.`;$('encouragement').textContent=m.streak>=4?`${m.streak} weeks strong! Dengue Defender energy.`:m.streak>=2?`${m.streak} weeks strong. Your consistency makes a difference.`:m.streak===1?'One complete week! Come back next week to keep growing.':'Your next good habit starts with one small action.';const start=new Date(current+'T12:00:00'),end=new Date(start);end.setDate(end.getDate()+6);const format=d=>d.toLocaleDateString('en-MY',{day:'numeric',month:'short'});$('week').textContent=format(start)+' – '+format(end);renderTasks();renderBadges(earned);renderLeaderboard(m);}\r\nfunction checkWeek(){if(weekKey()!==current){ensureWeek();save();tasks.forEach((_, i) => clearCompletionEffects(i));render();toast('A new week is here. Your historical points and badges are saved.');return true;}return false;}\r\n// Animation values never affect the ledger or leaderboard. Restart counters from\r\n// their current visible values when users toggle quickly.\r\nconst counterFrames = new Map();\r\nfunction animateCounter(element, from, to, suffix = '') {\r\n  cancelAnimationFrame(counterFrames.get(element));\r\n  if (matchMedia('(prefers-reduced-motion: reduce)').matches) {\r\n    element.textContent = to.toLocaleString() + suffix;\r\n    return;\r\n  }\r\n  const start = performance.now();\r\n  function frame(now) {\r\n    const progress = Math.min(1, (now - start) / 550);\r\n    const value = Math.round(from + (to - from) * (1 - Math.pow(1 - progress, 3)));\r\n    element.textContent = value.toLocaleString() + suffix;\r\n    if (progress \u003c 1) counterFrames.set(element, requestAnimationFrame(frame));\r\n    else counterFrames.delete(element);\r\n  }\r\n  counterFrames.set(element, requestAnimationFrame(frame));\r\n}\r\nfunction temporaryEffect(parent, text, className) {\r\n  const effect = document.createElement('span');\r\n  effect.className = className;\r\n  effect.textContent = text;\r\n  effect.setAttribute('aria-hidden', 'true');\r\n  parent.append(effect);\r\n  setTimeout(() => effect.remove(), 1800);\r\n}\r\nfunction clearCompletionEffects(index) {\r\n  const card = $('task-' + index).closest('.task');\r\n  card.classList.remove('task-pop');\r\n  card.querySelectorAll('.floating-reward, .task-sparkles, .task-scene').forEach(node => node.remove());\r\n  $('checklist').classList.remove('mission-celebration');\r\n  $('checklist').querySelectorAll('.bon ess');\n  const addressSection = document.getElementById('addressSection');\n  const photoPreview = document.getElementById('photoPreview');\n  const reportForm = document.getElementById('reportForm');\n  const progressSummary = document.getElementById('progressSummary');\n  const statusList = document.getElementById('statusList');\n  const searchInput = document.getElementById('searchLocation');\n  const btnSearch = document.getElementById('btnSearch');\n\n  let reports = [];\n  let userPoints = 0;\n  let markersMap = new Map();\n\n  // Initialize mock reports for demo\n  function initMockReports(){\n    reports = [];\n    let idCtr = 1;\n    for(let state in stateDistricts){\n      for(let district in stateDistricts[state]){\n        for(let i = 0; i \u003c 5; i++){\n          let id = idCtr++;\n          let coords = stateDistricts[state][district];\n          reports.push({\n            id,\n            lat: coords[0] + (Math.random()-0.5)/100,\n            lng: coords[1] + (Math.random()-0.5)/100,\n            description: `Simulated breeding site #${id}`,\n            address: `${district}, ${state.charAt(0).toUpperCase()+state.slice(1)}`,\n            status: \"Received\",\n            timestamp: Date.now(),\n            photoUrl: '',\n            threat: Math.random() \u003c 0.2\n          });\n        }\n      }\n    }\n  }\n\n  // Add or update mosquito markers on map\n  function addMosquitoMarker(report){\n    if(report.status === \"Resolved\"){\n      if(markersMap.has(report.id)){\n        map.removeLayer(markersMap.get(report.id));\n        markersMap.delete(report.id);\n      }\n      return;\n    }\n    let icon = report.threat ? mosquitoRedIcon : mosquitoIcon;\n    if(report.status === \"Reviewed\"){\n      icon = mosquitoIcon;\n    }\n\n    if(markersMap.has(report.id)){\n      markersMap.get(report.id).setLatLng([report.lat, report.lng]);\n      markersMap.get(report.id).setIcon(icon);\n      markersMap.get(report.id).setPopupContent(`\n        \u
